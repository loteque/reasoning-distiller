name: Evidence Context Packaging V2 Protocol Amendment

on:
  push:
    branches:
      - 'evidence/context-packaging-v2-protocol-amendment'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate-bound-conformance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout evidence child
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Bind evidence to immutable candidate
        run: |
          test "$(git rev-parse HEAD^)" = "4a7e6e4c2a5caf5e418fa539a7ccaba707c4931b"
          echo "candidate_sha=4a7e6e4c2a5caf5e418fa539a7ccaba707c4931b" >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install schema validator
        run: python -m pip install --disable-pip-version-check jsonschema==4.25.1

      - name: Run V2 amendment conformance
        run: |
          python -m unittest -v \
            tests.test_context_packaging_protocol_schemas_v2 \
            tests.test_context_packaging_v2_bytes_digests_toolchain

      - name: Run unaffected P0-P4 regressions
        run: |
          python -m unittest -v \
            tests.test_context_packaging_pressure_cases_p0 \
            tests.test_context_packaging_source_identity_p1a \
            tests.test_context_packaging_protocol_schemas_p1b \
            tests.test_context_packaging_bytes_digests_toolchain_p1c \
            tests.test_context_packaging_pems_closure_p1d \
            tests.test_context_packaging_consumer_profile_eligibility_p1e \
            tests.test_context_packaging_source_resolution_p2 \
            tests.test_context_packaging_source_resolution_p2_regression \
            tests.test_context_packaging_pems_projection_p3 \
            tests.test_context_packaging_cove_adapter_p4

      - name: Classify inherited P5 state without gating amendment
        id: inherited_p5
        shell: bash
        run: |
          set +e
          set -o pipefail
          python -m unittest -v \
            tests.test_context_packaging_pack_builder_p5 \
            tests.test_runtime_isolation_p5 2>&1 | tee inherited-p5.log
          status=${PIPESTATUS[0]}
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          {
            echo "### Inherited P5 classification"
            echo "P5 tests were executed only to classify the inherited state; they do not gate or remediate this amendment."
            echo "Exit code: $status"
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: Record amendment gate result
        run: |
          {
            echo "### Amendment gate"
            echo "V2 amendment tests and unaffected P0-P4 regressions passed."
            echo "Inherited P5 exit code: ${{ steps.inherited_p5.outputs.exit_code }}"
            echo "No P5 remediation, P6, admission, or canonical mutation was performed by this workflow."
          } >> "$GITHUB_STEP_SUMMARY"
