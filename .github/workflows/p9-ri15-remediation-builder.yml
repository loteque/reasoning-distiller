name: P9 RI-15 remediation builder and exact-runtime gate

on:
  push:
    branches:
      - evidence/p9-ri15-remediation-c21535e0-20260825

permissions:
  contents: write

jobs:
  remediate-and-execute:
    runs-on: ubuntu-latest
    steps:
      - name: Check out evidence transport
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Preserve external P9R4 harnesses
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "bd27aac3b1298d4d4f8bb700dc33d3bcfb665080"
          cp tests/test_context_packaging_renderer_p9r4_external_execution.py /tmp/test_context_packaging_renderer_p9r4_external_execution.py
          cp tests/test_context_packaging_renderer_p9r4_corrected_cases.py /tmp/test_context_packaging_renderer_p9r4_corrected_cases.py
          {
            echo "transport=$(git rev-parse HEAD)"
            echo "external_harness_blob=$(git rev-parse HEAD:tests/test_context_packaging_renderer_p9r4_external_execution.py)"
            echo "corrected_harness_blob=$(git rev-parse HEAD:tests/test_context_packaging_renderer_p9r4_corrected_cases.py)"
          } | tee /tmp/p9-ri15-transport.txt

      - name: Construct minimal semantic remediation from failed P9R3 candidate
        shell: bash
        run: |
          set -euo pipefail
          git checkout -B implement/p9-ri15-remediation-c21535e0 c21535e0d2820b0a1ba1866da60059a450470658
          test "$(git rev-parse HEAD)" = "c21535e0d2820b0a1ba1866da60059a450470658"
          test "$(git rev-parse HEAD^)" = "ebb436a14dee2a67d778e3252892f7be5cd0e2ca"
          test "$(git rev-parse HEAD:context_packaging/renderer.py)" = "5512ec147e74d7a2e18f9ba10fc31cf62a1dacac"

          python - <<'PY'
          from pathlib import Path

          path = Path("context_packaging/renderer.py")
          text = path.read_text()

          old_render = '''def render_context_pack_v2(pack: Mapping[str, Any], profile_raw: bytes, profile: Mapping[str, Any]) -> RenderedActivationResult:\n    bundle = _resolve_bundle()\n    return bundle[103](bundle, pack, profile_raw, profile)\n'''
          new_render = '''def render_context_pack_v2(pack: Mapping[str, Any], profile_raw: bytes, profile: Mapping[str, Any]) -> RenderedActivationResult:\n    bundle = _resolve_bundle()\n    if bundle[3] is not _resolve_bundle:\n        return bundle[25](failure=bundle[24](bundle, 'UNSUPPORTED_RENDERER', 'resolved bundle does not bind active resolver'))\n    return bundle[103](bundle, pack, profile_raw, profile)\n'''
          old_decode = '''def decode_rendered_activation_v2(raw: bytes, profile_raw: bytes, profile: Mapping[str, Any]) -> RenderedActivationDecodeResult:\n    bundle = _resolve_bundle()\n    return bundle[104](bundle, raw, profile_raw, profile)\n'''
          new_decode = '''def decode_rendered_activation_v2(raw: bytes, profile_raw: bytes, profile: Mapping[str, Any]) -> RenderedActivationDecodeResult:\n    bundle = _resolve_bundle()\n    if bundle[3] is not _resolve_bundle:\n        return bundle[26](failure=bundle[24](bundle, 'UNSUPPORTED_RENDERER', 'resolved bundle does not bind active resolver'))\n    return bundle[104](bundle, raw, profile_raw, profile)\n'''

          assert text.count(old_render) == 1
          assert text.count(old_decode) == 1
          text = text.replace(old_render, new_render).replace(old_decode, new_decode)
          path.write_text(text)
          PY

          cat > tests/test_context_packaging_renderer_ri15_remediation.py <<'PY'
          from __future__ import annotations

          import context_packaging.renderer as renderer
          from tests.test_context_packaging_renderer_execution_binding_p9r3 import _pack, _profile_v2


          def test_ri15_substituted_resolver_cannot_verify_one_bundle_and_execute_another(monkeypatch):
              monkeypatch.setattr(renderer, "_RUNTIME_ABI_CAPTURE", renderer._EXPECTED_RUNTIME_ABI)
              truthful_binding = renderer.derive_execution_binding()
              pack = _pack()
              profile_raw, profile = _profile_v2(pack, truthful_binding)

              baseline = renderer.render_context_pack_v2(pack, profile_raw, profile)
              assert baseline.ok, baseline.failure

              captured = renderer._resolve_bundle()
              monkeypatch.setattr(renderer, "_resolve_bundle", lambda: list(captured))

              rendered = renderer.render_context_pack_v2(pack, profile_raw, profile)
              assert not rendered.ok
              assert rendered.failure["code"] == "UNSUPPORTED_RENDERER"

              decoded = renderer.decode_rendered_activation_v2(
                  baseline.serialized_activation, profile_raw, profile
              )
              assert not decoded.ok
              assert decoded.failure["code"] == "UNSUPPORTED_RENDERER"
          PY

          test "$(git diff --name-only | sort)" = $'context_packaging/renderer.py\ntests/test_context_packaging_renderer_ri15_remediation.py'
          git config user.name "p9-ri15-remediation-bot"
          git config user.email "p9-ri15-remediation-bot@users.noreply.github.com"
          git add context_packaging/renderer.py tests/test_context_packaging_renderer_ri15_remediation.py
          git commit -m "Remediate P9 RI-15 resolver divergence"
          candidate="$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD^)" = "c21535e0d2820b0a1ba1866da60059a450470658"
          test "$(git diff-tree --no-commit-id --name-only -r HEAD | sort)" = $'context_packaging/renderer.py\ntests/test_context_packaging_renderer_ri15_remediation.py'
          echo "P9_RI15_CANDIDATE=$candidate" >> "$GITHUB_ENV"
          {
            echo "candidate=$candidate"
            echo "parent=$(git rev-parse HEAD^)"
            echo "tree=$(git rev-parse HEAD^{tree})"
            echo "renderer_blob=$(git rev-parse HEAD:context_packaging/renderer.py)"
            echo "ri15_regression_blob=$(git rev-parse HEAD:tests/test_context_packaging_renderer_ri15_remediation.py)"
          } | tee /tmp/p9-ri15-candidate.txt
          git push origin HEAD:refs/heads/implement/p9-ri15-remediation-c21535e0

      - name: Set up exact CPython 3.12.0
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.0"

      - name: Verify exact runtime ABI
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' | tee /tmp/p9-ri15-runtime.txt
          import platform
          import sys
          print(f"implementation={sys.implementation.name}")
          print(f"version={sys.version}")
          print(f"version_info={sys.version_info[:3]}")
          print(f"cache_tag={sys.implementation.cache_tag}")
          assert platform.python_implementation() == "CPython"
          assert sys.implementation.name == "cpython"
          assert sys.version_info[:3] == (3, 12, 0)
          assert sys.implementation.cache_tag == "cpython-312"
          PY

      - name: Install bounded test dependencies
        run: python -m pip install --disable-pip-version-check pytest jsonschema==4.25.1 referencing PyYAML==6.0.2

      - name: Verify candidate identity and compile
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$P9_RI15_CANDIDATE"
          test "$(git rev-parse HEAD^)" = "c21535e0d2820b0a1ba1866da60059a450470658"
          test -z "$(git status --porcelain)"
          python -m py_compile \
            context_packaging/renderer.py \
            tests/test_context_packaging_renderer_ri15_remediation.py \
            /tmp/test_context_packaging_renderer_p9r4_external_execution.py \
            /tmp/test_context_packaging_renderer_p9r4_corrected_cases.py

      - name: Run P9R0-P9R3 frozen gates plus candidate-local RI-15 regression
        shell: bash
        run: |
          set +e
          python -m pytest -q \
            tests/test_context_packaging_renderer_identity_pressure_freeze_p9r0.py \
            tests/test_context_packaging_renderer_identity_protocol_freeze_p9r1.py \
            tests/test_context_packaging_renderer_closed_bundle_p9r2.py \
            tests/test_context_packaging_renderer_execution_binding_p9r3.py \
            tests/test_context_packaging_renderer_ri15_remediation.py \
            2>&1 | tee /tmp/p9-ri15-frozen-local-gates.txt
          status=${PIPESTATUS[0]}
          set -e
          echo "P9_RI15_FROZEN_STATUS=$status" >> "$GITHUB_ENV"

      - name: Run authoritative RI-01 through RI-24 matrix
        shell: bash
        run: |
          set +e
          PYTHONPATH="$PWD:/tmp" python -m pytest -q -vv \
            /tmp/test_context_packaging_renderer_p9r4_external_execution.py \
            -k 'not RI_02 and not RI_17' \
            2>&1 | tee /tmp/p9-ri15-ri-matrix.txt
          base_status=${PIPESTATUS[0]}
          PYTHONPATH="$PWD:/tmp" python -m pytest -q -vv \
            /tmp/test_context_packaging_renderer_p9r4_corrected_cases.py \
            2>&1 | tee -a /tmp/p9-ri15-ri-matrix.txt
          corrected_status=${PIPESTATUS[0]}
          status=0
          if [ "$base_status" -ne 0 ] || [ "$corrected_status" -ne 0 ]; then
            status=1
          fi
          set -e
          echo "P9_RI15_RI_BASE_STATUS=$base_status" >> "$GITHUB_ENV"
          echo "P9_RI15_RI_CORRECTED_STATUS=$corrected_status" >> "$GITHUB_ENV"
          echo "P9_RI15_RI_STATUS=$status" >> "$GITHUB_ENV"

      - name: Run original P9 renderer regressions
        shell: bash
        run: |
          set +e
          python -m pytest -q tests/test_context_packaging_deterministic_renderer_p9.py \
            2>&1 | tee /tmp/p9-ri15-original-p9-pytest.txt
          pytest_status=${PIPESTATUS[0]}
          python -m unittest -v tests.test_context_packaging_deterministic_renderer_p9 \
            2>&1 | tee /tmp/p9-ri15-original-p9-unittest.txt
          unittest_status=${PIPESTATUS[0]}
          set -e
          echo "P9_RI15_ORIGINAL_PYTEST_STATUS=$pytest_status" >> "$GITHUB_ENV"
          echo "P9_RI15_ORIGINAL_UNITTEST_STATUS=$unittest_status" >> "$GITHUB_ENV"

      - name: Run unaffected P0-P8 context-packaging regressions
        shell: bash
        run: |
          set +e
          mapfile -t tests < <(
            find tests -maxdepth 1 -type f -name 'test_context_packaging_*.py' -print \
              | sort \
              | grep -v -E 'deterministic_renderer_p9|renderer_.*_p9r[0-9]|renderer_ri15_remediation'
          )
          python -m pytest -q "${tests[@]}" \
            -k 'not test_p5_runtime_implementation_is_unchanged_by_amendment and not test_negative_fixtures_reject_and_classify_exactly' \
            2>&1 | tee /tmp/p9-ri15-p0-p8-regressions.txt
          status=${PIPESTATUS[0]}
          set -e
          echo "P9_RI15_P0_P8_STATUS=$status" >> "$GITHUB_ENV"

      - name: Reproduce inherited P1b PS-19 classifier mismatch separately
        shell: bash
        run: |
          set +e
          python -m pytest -q tests/test_context_packaging_protocol_schemas_p1b.py::P1b::test_negative_fixtures_reject_and_classify_exactly \
            2>&1 | tee /tmp/p9-ri15-inherited-ps19.txt
          status=${PIPESTATUS[0]}
          set -e
          test "$status" -eq 1
          grep -F 'PS-19' /tmp/p9-ri15-inherited-ps19.txt
          grep -F 'PLANE_CLASSIFICATION_CONFLICT' /tmp/p9-ri15-inherited-ps19.txt
          grep -F 'UNKNOWN_SEMANTICS_FIELD' /tmp/p9-ri15-inherited-ps19.txt
          echo 'P1B_PS19_CLASSIFIER_MISMATCH_REPRODUCED' | tee -a /tmp/p9-ri15-inherited-ps19.txt

      - name: Enforce complete RI-15 remediation gate
        shell: bash
        run: |
          set -euo pipefail
          cat /tmp/p9-ri15-candidate.txt
          cat /tmp/p9-ri15-runtime.txt
          printf '%s\n' \
            "frozen_status=${P9_RI15_FROZEN_STATUS}" \
            "ri_base_status=${P9_RI15_RI_BASE_STATUS}" \
            "ri_corrected_status=${P9_RI15_RI_CORRECTED_STATUS}" \
            "ri_status=${P9_RI15_RI_STATUS}" \
            "original_pytest_status=${P9_RI15_ORIGINAL_PYTEST_STATUS}" \
            "original_unittest_status=${P9_RI15_ORIGINAL_UNITTEST_STATUS}" \
            "p0_p8_status=${P9_RI15_P0_P8_STATUS}" \
            | tee /tmp/p9-ri15-summary.txt
          test "$P9_RI15_FROZEN_STATUS" -eq 0
          test "$P9_RI15_RI_STATUS" -eq 0
          test "$P9_RI15_ORIGINAL_PYTEST_STATUS" -eq 0
          test "$P9_RI15_ORIGINAL_UNITTEST_STATUS" -eq 0
          test "$P9_RI15_P0_P8_STATUS" -eq 0
          echo P9_RI15_REMEDIATION_EXECUTION_PASS | tee -a /tmp/p9-ri15-summary.txt
