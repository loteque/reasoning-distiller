name: Prepare Rupi initial root on main

on:
  pull_request:
    paths:
      - '.github/workflows/rupi-main-invocation.yml'

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact main baseline
        uses: actions/checkout@v4
        with:
          ref: ea321c4e77de6e179d6afdb73b132141ac2e971d
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Prepare protected initial-root proposal
        run: |
          python - <<'PY'
          import json
          import sys
          from pathlib import Path

          root = Path('.').resolve()
          runtime = root / '.reasoning-distiller' / 'runtime'
          sys.path.insert(0, str(runtime))

          import rupi_authority

          result = rupi_authority.prepare_initial_root(
              root,
              operator_id='operator:loteque',
              requested_goal='initialize Reasoning Distiller project authority on main',
          )
          print(json.dumps(result, indent=2, sort_keys=True))
          assert result['status'] == 'STOPPED'
          assert result['outcome'] == 'INITIAL_ROOT_CONFIRMATION_REQUIRED'
          assert result['required_confirmation'] == 'ESTABLISH_ROOT_OPERATOR'
          assert result['proposal_reference']
          PY

      - name: Prove proposal preparation was read-only
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          test -z "$(git status --porcelain=v1)"
