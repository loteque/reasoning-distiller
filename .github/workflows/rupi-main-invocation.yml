name: Invoke Rupi on main

on:
  push:
    branches:
      - rupi/main-invocation
    paths:
      - '.github/workflows/rupi-main-invocation.yml'

permissions:
  contents: write

jobs:
  invoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact main baseline
        uses: actions/checkout@v4
        with:
          ref: ea321c4e77de6e179d6afdb73b132141ac2e971d
          path: main-target
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout invocation evidence branch
        uses: actions/checkout@v4
        with:
          ref: rupi/main-invocation
          path: harness
          fetch-depth: 1
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Invoke installed Rupi against main
        run: |
          python - <<'PY'
          import json
          import sys
          from pathlib import Path

          root = Path('main-target').resolve()
          runtime = root / '.reasoning-distiller' / 'runtime'
          sys.path.insert(0, str(runtime))

          import ril_status
          import rupi

          status = ril_status.classify_status(root)
          blocker = status.get('blocker')
          boundary = blocker.get('code') if isinstance(blocker, dict) else None
          checkpoint = rupi.build_checkpoint(
              requested_goal='activate Rupi for main',
              status_result=status,
              primitive_results=[{'action': 'inspect_status', 'result': status}],
              boundary=boundary,
              durable_artifacts=['.reasoning-distiller'],
          )
          control = rupi.control_return_from_checkpoint(checkpoint)
          result = {
              'contract': 'reasoning-distiller-rupi-main-invocation/1',
              'status': 'PASS',
              'rupi_invoked': True,
              'main_sha': 'ea321c4e77de6e179d6afdb73b132141ac2e971d',
              'checkpoint': checkpoint,
              'control_return': control,
          }
          Path('/tmp/rupi-main-invocation.json').write_text(
              json.dumps(result, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          print(json.dumps(result, indent=2, sort_keys=True))
          assert status['status'] == 'PASS'
          assert status['dimensions']['installation'] == 'VALID'
          PY

      - name: Prove invocation was read-only
        shell: bash
        run: |
          set -euo pipefail
          git -C main-target diff --exit-code
          test -z "$(git -C main-target status --porcelain=v1)"

      - name: Persist invocation receipt on evidence branch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p harness/rupi-evidence
          cp /tmp/rupi-main-invocation.json harness/rupi-evidence/main-invocation.json
          cd harness
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- rupi-evidence/main-invocation.json
          git diff --cached --check
          git commit -m 'rupi: record main invocation checkpoint'
          git push origin HEAD:rupi/main-invocation
