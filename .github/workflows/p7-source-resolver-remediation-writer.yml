name: P7 source-resolver remediation writer

on:
  pull_request:
    branches:
      - implement/context-packaging-p7-remediation-v2

permissions:
  contents: write

jobs:
  apply-bounded-remediation:
    if: github.head_ref == 'automation/p7-source-resolver-remediation-20260824'
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact P7 remediation target branch
        uses: actions/checkout@v4
        with:
          ref: implement/context-packaging-p7-remediation-v3
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply source-resolver transitive identity remediation
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "987220cdac4e060d524dfbf9fb188490e734cf91"
          python - <<'PY'
          from hashlib import sha1
          from pathlib import Path

          def git_blob_sha(path: str) -> str:
              raw = Path(path).read_bytes()
              return sha1(b"blob " + str(len(raw)).encode("ascii") + b"\0" + raw).hexdigest()

          assert git_blob_sha("context_packaging/pack_builder.py") == "eedc2c92f23f814c4c1294c25b6f0d60dcbf6ef5"
          assert git_blob_sha("context_packaging/source_resolver.py") == "11da98c213e783ed4c31f88392eb6a5634c9643e"
          assert git_blob_sha(".gitattributes") == "89c07463e5b89bd1acf03f3dd45b3badd890dbc6"

          attrs_path = Path(".gitattributes")
          attrs = attrs_path.read_text(encoding="utf-8")
          anchor = "context_packaging/pack_builder_v1.py -text\n"
          addition = anchor + "context_packaging/source_resolver.py -text\n"
          assert attrs.count(anchor) == 1
          attrs = attrs.replace(anchor, addition, 1)
          attrs_path.write_text(attrs, encoding="utf-8", newline="\n")

          builder_path = Path("context_packaging/pack_builder.py")
          text = builder_path.read_text(encoding="utf-8")

          import_anchor = "from . import pack_builder_v1 as _v1\n"
          assert text.count(import_anchor) == 1
          text = text.replace(
              import_anchor,
              import_anchor + "from . import source_resolver as _source_resolver\n",
              1,
          )

          constant_anchor = '_PACK_BUILDER_V1_BLOB = "b0e806e966598e6d819b6d52c643efa23cdb6ef9"\n'
          assert text.count(constant_anchor) == 1
          text = text.replace(
              constant_anchor,
              constant_anchor + '_SOURCE_RESOLVER_BLOB = "11da98c213e783ed4c31f88392eb6a5634c9643e"\n',
              1,
          )

          call_anchor = "        _verify_pack_builder_v1_identity()\n"
          assert text.count(call_anchor) == 1
          text = text.replace(
              call_anchor,
              call_anchor + "        _verify_source_resolver_identity()\n",
              1,
          )

          preflight_anchor = "\n\ndef _preflight_v2(\n"
          assert text.count(preflight_anchor) == 1
          helper = '''

def _verify_source_resolver_identity() -> None:
    if (
        _v1._snapshot_key is not _source_resolver._snapshot_key
        or _snapshot_key is not _source_resolver._snapshot_key
    ):
        raise _BuildFailure(
            "TOOLCHAIN_IDENTITY_MISMATCH",
            "pack_builder/2 source_resolver dependency binding mismatch",
            stage="toolchain",
        )
    source = getattr(_source_resolver, "__file__", None)
    if not isinstance(source, str) or not source:
        raise _BuildFailure(
            "TOOLCHAIN_IDENTITY_MISMATCH",
            "pack_builder/2 source_resolver dependency source is unavailable",
            stage="toolchain",
        )
    try:
        raw = Path(source).read_bytes()
    except OSError as exc:
        raise _BuildFailure(
            "TOOLCHAIN_IDENTITY_MISMATCH",
            "pack_builder/2 source_resolver dependency source is unavailable",
            stage="toolchain",
        ) from exc
    actual = hashlib.sha1(
        b"blob " + str(len(raw)).encode("ascii") + b"\\0" + raw
    ).hexdigest()
    if actual != _SOURCE_RESOLVER_BLOB:
        raise _BuildFailure(
            "TOOLCHAIN_IDENTITY_MISMATCH",
            "pack_builder/2 source_resolver dependency identity mismatch",
            stage="toolchain",
        )
'''
          text = text.replace(preflight_anchor, helper + preflight_anchor, 1)
          builder_path.write_text(text, encoding="utf-8", newline="\n")
          PY

          cat > tests/test_context_packaging_reproducibility_p7_source_resolver_identity.py <<'PYTEST'
          from __future__ import annotations

          import importlib.util
          from pathlib import Path
          import sys
          import tempfile
          import unittest
          from unittest.mock import patch

          ROOT = Path(__file__).resolve().parents[1]
          P5_TEST = ROOT / "tests/test_context_packaging_pack_builder_p5.py"
          sys.path.insert(0, str(ROOT))

          import context_packaging.pack_builder as pack_builder_v2


          def _load_p5_fixture_module():
              spec = importlib.util.spec_from_file_location(
                  "context_packaging_p5_fixture_p7_source_resolver", P5_TEST
              )
              assert spec is not None and spec.loader is not None
              module = importlib.util.module_from_spec(spec)
              spec.loader.exec_module(module)
              return module


          class P7SourceResolverDependencyIdentity(unittest.TestCase):
              def test_behavior_bearing_source_resolver_mutation_fails_closed(self):
                  p5 = _load_p5_fixture_module()
                  baseline_fx = p5._fixture(semantic_item=True)
                  baseline = p5._build(baseline_fx)
                  self.assertTrue(baseline.ok, baseline.failure)

                  changed_fx = p5._fixture(semantic_item=True)
                  recorded_builder = dict(
                      next(
                          component
                          for component in changed_fx["components"]
                          if component["role"] == "pack_builder"
                      )
                  )
                  source_path = Path(pack_builder_v2._source_resolver.__file__)
                  source_raw = source_path.read_bytes()
                  with tempfile.TemporaryDirectory() as td:
                      mutated = Path(td) / "source_resolver.py"
                      mutated.write_bytes(
                          source_raw
                          + b"\n# P7 adversarial behavior-bearing dependency mutation\n"
                          + b"def _snapshot_key(binding):\n"
                          + b"    return ('mutated-source-resolver',)\n"
                      )
                      with patch.object(
                          pack_builder_v2._source_resolver, "__file__", str(mutated)
                      ):
                          changed = p5._build(changed_fx)

                  self.assertFalse(changed.ok)
                  self.assertEqual(changed.failure["code"], "TOOLCHAIN_IDENTITY_MISMATCH")
                  self.assertEqual(changed.failure["stage"], "toolchain")
                  self.assertIn(
                      "source_resolver dependency identity mismatch",
                      changed.failure["diagnostics"][0],
                  )
                  self.assertEqual(
                      next(
                          component
                          for component in changed_fx["components"]
                          if component["role"] == "pack_builder"
                      ),
                      recorded_builder,
                  )


          if __name__ == "__main__":
              unittest.main()
          PYTEST

          git diff --check
          git diff -- .gitattributes context_packaging/pack_builder.py tests/test_context_packaging_reproducibility_p7_source_resolver_identity.py

      - name: Commit exact remediation candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "loteque"
          git config user.email "69282314+loteque@users.noreply.github.com"
          git add .gitattributes context_packaging/pack_builder.py tests/test_context_packaging_reproducibility_p7_source_resolver_identity.py
          test -n "$(git diff --cached --name-only)"
          git commit -m "Bind P7 source resolver dependency identity"
          git push origin HEAD:refs/heads/implement/context-packaging-p7-remediation-v3
