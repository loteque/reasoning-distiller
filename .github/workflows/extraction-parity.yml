name: Extraction Parity

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check jsonschema==4.25.1 PyYAML==6.0.2
      - name: RGP fixture parity
        run: python tests/run_fixture_tests.py
      - name: Project Knowledge Package contract
        run: python tests/check_project_package.py
      - name: Framework isolation and authority boundary
        run: python tests/check_framework_isolation.py
      - name: Frozen source blob integrity
        run: python tests/check_corpus_integrity.py
      - name: Validator version
        run: python validators/rgp_validator.py --version
      - name: PEMS/2 backend contract
        run: python backends/pems-cove/validate_pems2_contract.py
      - name: RGP uncertainty import compatibility
        run: python backends/pems-cove/validate_rgp_uncertainty_import.py
      - name: Guarded v2 admission pressure suite
        run: python admission/test_admission_transaction_v2.py
      - name: Validate preserved Phase 1 and Phase 3 candidates unchanged
        run: |
          python - <<'PY'
          import json, sys
          from pathlib import Path
          sys.path.insert(0, str(Path('validators').resolve()))
          from validate_distillation import validate

          root = Path('evaluation/corpus/voxel-engine/phase1/independent')
          closeout = json.loads((root / 'closeout.json').read_text(encoding='utf-8'))
          batch = closeout['batch']
          phase1 = []
          for directory in batch:
              for path in sorted((root / directory).rglob('*.json')):
                  try:
                      doc = json.loads(path.read_text(encoding='utf-8'))
                  except json.JSONDecodeError:
                      continue
                  if isinstance(doc, dict) and isinstance(doc.get('records'), list):
                      phase1.append(path)
          phase3 = sorted(Path('evaluation/corpus/voxel-engine/phase3/shadow').rglob('candidate.rgp.json'))
          expected_phase1 = len(closeout['runs'])
          assert expected_phase1 == 15, f'closeout expected 15 Phase-1 runs, found {expected_phase1}'
          assert len(phase1) == expected_phase1, f'expected {expected_phase1} closeout Phase-1 raw candidates, found {len(phase1)}'
          assert len(phase3) == 5, f'expected 5 Phase-3 shadow candidates, found {len(phase3)}'
          for path in phase1 + phase3:
              errors = validate(json.loads(path.read_text(encoding='utf-8')))
              if errors:
                  raise SystemExit(f'{path}: {errors}')
              print(f'PASS {path}')
          print(json.dumps({'phase1_candidates':len(phase1),'phase3_candidates':len(phase3),'passed':True}, sort_keys=True))
          PY
      - name: Verify frozen Steward transaction and proof fixture
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          tx=Path('evaluation/corpus/voxel-engine/admission/transactions/RGP-20260817T073100-0700-007.steward-016-v2.json')
          proof=Path('evaluation/corpus/voxel-engine/admission/proofs/RGP-20260817T073100-0700-007.admission-016-v2/admission-proof.json')
          t=json.loads(tx.read_text(encoding='utf-8'))
          p=json.loads(proof.read_text(encoding='utf-8'))
          assert t['contract'] == 'rgp-pems2-admission-transaction/2'
          assert p['contract'] == t['contract']
          assert p['base']['sha256'] == t['expected_base_sha256']
          assert p['proofs']['base_exact_match'] is True
          assert p['proofs']['record_update_before_states_exact'] is True
          assert p['proofs']['record_identity_preserved'] is True
          assert p['proofs']['record_kind_preserved'] is True
          assert p['proofs']['canonical_written'] is False
          assert p['transaction']['new_record_count'] == len(t['new_records']) == 4
          assert p['transaction']['reuse_record_count'] == len(t['reuse_record_ids']) == 5
          assert p['transaction']['record_update_count'] == len(t['record_updates']) == 1
          print('PASS frozen Steward transaction/proof fixture')
          PY

  realistic-context-pack-preparation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.0'
      - name: Install context-pack dependencies
        run: python -m pip install --disable-pip-version-check jsonschema==4.25.1 PyYAML==6.0.2
      - name: Materialize realistic context pack and production preparation
        env:
          PYTHONPATH: .reasoning-distiller
        run: |
          set -o pipefail
          python --version
          python evaluation/context-packaging/materialize_realistic_context_pack.py --out .context-pack-trial | tee .context-pack-trial.log
      - name: Capture exact blocker evidence when materialization fails
        if: always()
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import sys

          out = Path('.context-pack-trial')
          out.mkdir(parents=True, exist_ok=True)
          success = out / 'evidence-summary.json'
          if success.exists():
              print('production preparation evidence exists; blocker record not needed')
              raise SystemExit(0)

          pems_path = Path('project-knowledge/canonical/pems2.jcs.json')
          cove_path = Path('project-knowledge/canonical/cove1.jcs.json')
          schema_path = Path('.reasoning-distiller/backends/pems-cove/pems-v2.schema.json')
          receipt_path = Path('project-knowledge/admission/receipts/35ae25fea959c5567eeb70194889309c0ad89dde0dff8e5400df5ba1653b50ec.json')
          pems_raw = pems_path.read_bytes()
          cove_raw = cove_path.read_bytes()
          schema_raw = schema_path.read_bytes()
          receipt_raw = receipt_path.read_bytes()
          pems = json.loads(pems_raw)
          schema = json.loads(schema_raw)
          receipt = json.loads(receipt_raw)
          sha = lambda raw: 'sha256:' + hashlib.sha256(raw).hexdigest()

          record = {
              'contract': 'reasoning-distiller-realistic-context-pack-blocker-evidence/1',
              'status': 'BLOCKED_PEMS_SCHEMA_INVALID',
              'coordination_revision': 'd46300a54a444cc866717986c1f5b493de3ab13f',
              'trial_head': '5f92658a239bc096849025ed14ab9e57d0afb710',
              'runtime': {
                  'implementation': sys.implementation.name,
                  'version': '.'.join(map(str, sys.version_info[:3])),
                  'cache_tag': sys.implementation.cache_tag,
              },
              'canonical_pems': {
                  'path': str(pems_path),
                  'git_blob': 'bb7c474e935243b45ff02a5778a94bbcdc654d72',
                  'raw_sha256': sha(pems_raw),
                  'admission_receipt_admitted_pems_sha256': 'sha256:' + receipt['admitted_pems_sha256'].removeprefix('sha256:'),
                  'top_level_keys': sorted(pems),
                  'semantic_present': 'semantic' in pems,
                  'semantic_value': pems.get('semantic'),
              },
              'canonical_cove': {
                  'path': str(cove_path),
                  'git_blob': '7ff52fb925a667c4cc1782da9b475dff831e45ef',
                  'raw_sha256': sha(cove_raw),
                  'admission_receipt_admitted_cove_sha256': 'sha256:' + receipt['admitted_cove_sha256'].removeprefix('sha256:'),
              },
              'pems_schema': {
                  'path': str(schema_path),
                  'git_blob_at_coordination_revision': 'cd7683d704e8aef2842a0c1b25b453fb1dbc8030',
                  'raw_sha256': sha(schema_raw),
                  'required_top_level_keys': schema.get('required'),
                  'semantic_constraint': schema.get('properties', {}).get('semantic'),
              },
              'admission_receipt': {
                  'path': str(receipt_path),
                  'git_blob': '3d35dd4af7ab868262305a79a12cbe991d1d21ef',
                  'raw_sha256': sha(receipt_raw),
                  'contract': receipt.get('contract'),
              },
              'observed_p3_failure': {
                  'contract': 'reasoning-distiller-context-pack-failure/1',
                  'code': 'PEMS_SCHEMA_INVALID',
                  'stage': 'projection',
                  'diagnostic': 'canonical PEMS validation failed',
              },
              'boundary': {
                  'pack_materialized': False,
                  'production_prepare_performed': False,
                  'model_execution_performed': False,
                  'finalize_performed': False,
                  'submission_created': False,
                  'admission_or_canonical_mutation_performed': False,
              },
          }
          path = out / 'blocker-evidence-summary.json'
          path.write_text(json.dumps(record, sort_keys=True, separators=(',', ':')), encoding='utf-8')
          print(json.dumps(record, indent=2, sort_keys=True))
          PY
      - name: Print exact evidence summary
        if: always()
        run: |
          if [ -f .context-pack-trial/evidence-summary.json ]; then
            python -m json.tool .context-pack-trial/evidence-summary.json
          else
            python -m json.tool .context-pack-trial/blocker-evidence-summary.json
          fi
      - name: Upload exact materialization evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: realistic-context-pack-preparation-${{ github.run_id }}
          path: |
            .context-pack-trial/**
            .context-pack-trial.log
          if-no-files-found: error
