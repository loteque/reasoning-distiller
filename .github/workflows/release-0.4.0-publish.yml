name: Publish Reasoning Distiller 0.4.0

on:
  push:
    branches:
      - release-0.4.0-rc-package
    paths:
      - '.github/workflows/release-0.4.0-publish.yml'

permissions:
  contents: write

concurrency:
  group: reasoning-distiller-0.4.0-release
  cancel-in-progress: false

env:
  RELEASE_VERSION: '0.4.0'
  RELEASE_TAG: 'v0.4.0'
  SOURCE_SHA: '6259324d030822ac78da902f9288f18e8f071b84'
  EXPECTED_CONTENT_IDENTITY: 'sha256:f947fa0f4554a4bc46275a78b8e03f8dcaa8959324557243422400b49d1a7869'
  EXPECTED_TRANSPORT_SHA256: '2ce8a58d1b4278d906f560ccce07c568573be1f87f667976330fac3e92369d54'

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release evidence branch
        uses: actions/checkout@v4
        with:
          ref: release-0.4.0-rc-package
          fetch-depth: 0

      - name: Checkout exact release source
        uses: actions/checkout@v4
        with:
          repository: loteque/reasoning-distiller
          ref: ${{ env.SOURCE_SHA }}
          path: release-source
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install package-contract dependency
        run: python -m pip install --disable-pip-version-check jsonschema==4.25.1

      - name: Rebuild deterministic release package
        shell: bash
        run: |
          set -euo pipefail
          cd release-source
          python packaging/build_release_package.py \
            --version "$RELEASE_VERSION" \
            --source-commit "$SOURCE_SHA" \
            --output-dir /tmp/rd-release
          python packaging/validate_install_package_contract.py \
            --manifest "/tmp/rd-release/reasoning-distiller-${RELEASE_VERSION}.manifest.json"

      - name: Verify accepted RC identities
        shell: bash
        run: |
          set -euo pipefail
          manifest="/tmp/rd-release/reasoning-distiller-${RELEASE_VERSION}.manifest.json"
          detached="/tmp/rd-release/reasoning-distiller-${RELEASE_VERSION}.sha256"
          content_identity="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["content_identity"])' "$manifest")"
          transport_sha="$(awk '{print $1}' "$detached")"
          test "$content_identity" = "$EXPECTED_CONTENT_IDENTITY"
          test "$transport_sha" = "$EXPECTED_TRANSPORT_SHA256"
          echo "PASS exact RC identities reproduced"

      - name: Copy installer bootstrap assets
        shell: bash
        run: |
          set -euo pipefail
          cp release-source/packaging/rd_install.py /tmp/rd-release/rd_install.py
          cp release-source/packaging/validate_install_package_contract.py /tmp/rd-release/validate_install_package_contract.py
          cp release-source/schemas/install-package-manifest.schema.json /tmp/rd-release/install-package-manifest.schema.json
          cp release-source/schemas/installation-record.schema.json /tmp/rd-release/installation-record.schema.json

      - name: Create or verify immutable tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          archive="/tmp/rd-release/reasoning-distiller-${RELEASE_VERSION}.tar.gz"
          manifest="/tmp/rd-release/reasoning-distiller-${RELEASE_VERSION}.manifest.json"
          detached="/tmp/rd-release/reasoning-distiller-${RELEASE_VERSION}.sha256"
          assets=(
            "$archive"
            "$manifest"
            "$detached"
            "/tmp/rd-release/rd_install.py"
            "/tmp/rd-release/validate_install_package_contract.py"
            "/tmp/rd-release/install-package-manifest.schema.json"
            "/tmp/rd-release/installation-record.schema.json"
          )

          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" "${assets[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$SOURCE_SHA" \
              --title "Reasoning Distiller ${RELEASE_VERSION}" \
              --notes "Accepted Reasoning Distiller ${RELEASE_VERSION} deterministic release. Source: ${SOURCE_SHA}. Content identity: ${EXPECTED_CONTENT_IDENTITY}. Transport SHA-256: ${EXPECTED_TRANSPORT_SHA256}. Includes R16-R18 workflow, authority-grant, shared orchestration, CLI, and Human-Agent adapter conformance through G10."
          fi

          tag_sha="$(git ls-remote --tags "https://github.com/${GITHUB_REPOSITORY}.git" "refs/tags/$RELEASE_TAG" | awk '{print $1}')"
          test "$tag_sha" = "$SOURCE_SHA" || { echo "tag points to $tag_sha, expected $SOURCE_SHA" >&2; exit 1; }

          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | sort > /tmp/actual-assets.txt
          printf '%s\n' \
            "install-package-manifest.schema.json" \
            "installation-record.schema.json" \
            "rd_install.py" \
            "reasoning-distiller-${RELEASE_VERSION}.manifest.json" \
            "reasoning-distiller-${RELEASE_VERSION}.sha256" \
            "reasoning-distiller-${RELEASE_VERSION}.tar.gz" \
            "validate_install_package_contract.py" | sort > /tmp/expected-assets.txt
          diff -u /tmp/expected-assets.txt /tmp/actual-assets.txt
          echo "PASS immutable v0.4.0 release available"

      - name: Persist release publication PASS evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-candidate
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          status = {
            'contract': 'reasoning-distiller-release-publication-status/1',
            'status': 'PASS',
            'release_version': os.environ['RELEASE_VERSION'],
            'release_tag': os.environ['RELEASE_TAG'],
            'source_commit': os.environ['SOURCE_SHA'],
            'content_identity': os.environ['EXPECTED_CONTENT_IDENTITY'],
            'transport_sha256': os.environ['EXPECTED_TRANSPORT_SHA256'],
            'asset_count': 7,
            'workflow_run': os.environ['GITHUB_RUN_ID'],
          }
          Path('release-candidate/0.4.0-published.json').write_text(
              json.dumps(status, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add release-candidate/0.4.0-published.json
          if git diff --cached --quiet; then
            echo 'publication evidence already current'
          else
            git commit -m 'release: record published Reasoning Distiller 0.4.0'
            git push origin HEAD:release-0.4.0-rc-package
          fi
