name: Reasoning Distiller 0.4.0 RC Package

on:
  push:
    branches:
      - release-0.4.0-rc-package
  workflow_dispatch:

permissions:
  contents: read

env:
  RELEASE_VERSION: '0.4.0'
  SOURCE_SHA: '6259324d030822ac78da902f9288f18e8f071b84'

jobs:
  build-release-candidate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact verified source
        uses: actions/checkout@v4
        with:
          repository: loteque/reasoning-distiller
          ref: ${{ env.SOURCE_SHA }}
          path: release-source
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install package-contract dependency
        run: python -m pip install --disable-pip-version-check jsonschema==4.25.1

      - name: Run deterministic builder pressure tests
        working-directory: release-source
        run: python -m unittest -v tests/test_package_builder.py

      - name: Build twice from exact source
        working-directory: release-source
        shell: bash
        run: |
          set -euo pipefail
          python packaging/build_release_package.py \
            --version "$RELEASE_VERSION" \
            --source-commit "$SOURCE_SHA" \
            --output-dir /tmp/rd-0.4.0-a
          python packaging/build_release_package.py \
            --version "$RELEASE_VERSION" \
            --source-commit "$SOURCE_SHA" \
            --output-dir /tmp/rd-0.4.0-b
          cmp /tmp/rd-0.4.0-a/reasoning-distiller-0.4.0.tar.gz /tmp/rd-0.4.0-b/reasoning-distiller-0.4.0.tar.gz
          cmp /tmp/rd-0.4.0-a/reasoning-distiller-0.4.0.manifest.json /tmp/rd-0.4.0-b/reasoning-distiller-0.4.0.manifest.json
          cmp /tmp/rd-0.4.0-a/reasoning-distiller-0.4.0.sha256 /tmp/rd-0.4.0-b/reasoning-distiller-0.4.0.sha256

      - name: Validate release-candidate manifest
        working-directory: release-source
        run: python packaging/validate_install_package_contract.py --manifest /tmp/rd-0.4.0-a/reasoning-distiller-0.4.0.manifest.json

      - name: Print package identities
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path('/tmp/rd-0.4.0-a/reasoning-distiller-0.4.0.manifest.json').read_text())
          print('VERSION=' + manifest['version'])
          print('SOURCE_COMMIT=' + manifest['source_commit'])
          print('CONTENT_IDENTITY=' + manifest['content_identity'])
          print('TRANSPORT_SHA256=' + manifest['transport_sha256'])
          print('FILE_COUNT=' + str(len(manifest['files'])))
          PY

      - name: Upload release-candidate package
        uses: actions/upload-artifact@v4
        with:
          name: reasoning-distiller-0.4.0-rc-package
          path: |
            /tmp/rd-0.4.0-a/reasoning-distiller-0.4.0.tar.gz
            /tmp/rd-0.4.0-a/reasoning-distiller-0.4.0.manifest.json
            /tmp/rd-0.4.0-a/reasoning-distiller-0.4.0.sha256
          if-no-files-found: error
          retention-days: 7
