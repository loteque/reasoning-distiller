name: Phase 3 G9 Verification

on:
  push:
    branches:
      - phase3-g9-automation-boundaries
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: python -m pip install --upgrade pip jsonschema

      - name: Run full unit test suite
        run: python -m unittest discover -s tests -v
