name: P10 packaged PEMS P1b diagnostic

on:
  push:
    branches:
      - evidence/p10-pems-runtime-isolation-824c812e-20260826

permissions:
  contents: read

jobs:
  p1b-test:
    strategy:
      fail-fast: false
      matrix:
        test:
          - test_inventory_meta_and_closed_world
          - test_positive_examples
          - test_p1a_multi_snapshot_is_separately_addressable
          - test_negative_fixtures_reject_and_classify_exactly
          - test_p0_pressure_binding_and_guardrails
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 824c812ed6ffe79b6a9afe7bfc9c1f6eab656a27
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.0"
      - run: python -m pip install --disable-pip-version-check pytest jsonschema==4.25.1 referencing PyYAML==6.0.2
      - name: Run ${{ matrix.test }}
        run: python -m pytest -q tests/test_context_packaging_protocol_schemas_p1b.py::P1b::${{ matrix.test }}
