name: Verify Published Reasoning Distiller v0.5.0

on:
  push:
    branches:
      - release/publish-v0.5.0
    paths:
      - '.github/workflows/verify-published-v0.5.0.yml'

permissions:
  contents: write

concurrency:
  group: verify-published-reasoning-distiller-v0.5.0
  cancel-in-progress: false

env:
  RELEASE_VERSION: '0.5.0'
  RELEASE_TAG: 'v0.5.0'
  SOURCE_SHA: '9b68b4da5454a83992e6062c0b5ccb3d425284ce'
  EXPECTED_CONTENT_IDENTITY: 'sha256:848f41f8a1e4f0d2c6da885937e166f230c356d694a365fc5cbdffa3a5676a0c'
  EXPECTED_TRANSPORT_SHA256: 'c385d9a1d52ada92db05b9bb747b9ccf17c18b4de727f40b762b166f5a5f0c50'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout publication branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Verify published release and exact seven assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          expected=(
            "install-package-manifest.schema.json"
            "installation-record.schema.json"
            "rd_install.py"
            "reasoning-distiller-${RELEASE_VERSION}.manifest.json"
            "reasoning-distiller-${RELEASE_VERSION}.sha256"
            "reasoning-distiller-${RELEASE_VERSION}.tar.gz"
            "validate_install_package_contract.py"
          )
          printf '%s\n' "${expected[@]}" | sort > /tmp/expected-assets.txt

          for attempt in $(seq 1 20); do
            if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' >/tmp/assets-unsorted.txt 2>/dev/null; then
              sort /tmp/assets-unsorted.txt > /tmp/actual-assets.txt
              if diff -q /tmp/expected-assets.txt /tmp/actual-assets.txt >/dev/null; then
                break
              fi
            fi
            if [ "$attempt" -eq 20 ]; then
              echo 'release did not converge to exact seven assets' >&2
              cat /tmp/actual-assets.txt 2>/dev/null || true
              exit 1
            fi
            sleep 3
          done

          tag_sha="$(git ls-remote --tags origin "refs/tags/$RELEASE_TAG" | awk '{print $1}')"
          test "$tag_sha" = "$SOURCE_SHA" || { echo "release tag points to $tag_sha, expected $SOURCE_SHA" >&2; exit 1; }

          mkdir -p /tmp/release-assets
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir /tmp/release-assets

          actual_archive_sha="$(sha256sum "/tmp/release-assets/reasoning-distiller-${RELEASE_VERSION}.tar.gz" | awk '{print $1}')"
          detached_sha="$(awk '{print $1}' "/tmp/release-assets/reasoning-distiller-${RELEASE_VERSION}.sha256")"
          test "$actual_archive_sha" = "$EXPECTED_TRANSPORT_SHA256"
          test "$detached_sha" = "$EXPECTED_TRANSPORT_SHA256"

          python - <<'PY'
          import json, os
          from pathlib import Path
          root = Path('/tmp/release-assets')
          version = os.environ['RELEASE_VERSION']
          manifest = json.loads((root / f'reasoning-distiller-{version}.manifest.json').read_text(encoding='utf-8'))
          assert manifest['version'] == version
          assert manifest['source_commit'] == os.environ['SOURCE_SHA']
          assert manifest['content_identity'] == os.environ['EXPECTED_CONTENT_IDENTITY']
          assert manifest['transport_sha256'] == os.environ['EXPECTED_TRANSPORT_SHA256']
          paths = {item['path'] for item in manifest['files']}
          required = {
              'runtime/rupi.py',
              'runtime/rupi_lifecycle.py',
              'runtime/rupi_authority.py',
              'runtime/rupi_primitive_map.py',
              'runtime/rd_install_recovery.py',
              'runtime/ril_human_confirmation.py',
          }
          assert not (required - paths), sorted(required - paths)
          PY

          echo 'PASS public release tag, seven assets, archive digest, manifest identity, and Rupi payload verified'

      - name: Persist publication receipt on isolated release branch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-evidence
          python - <<'PY'
          import json, os
          from pathlib import Path
          assets = Path('/tmp/actual-assets.txt').read_text(encoding='utf-8').splitlines()
          receipt = {
              'contract': 'reasoning-distiller-release-publication-receipt/1',
              'status': 'PASS',
              'release_version': os.environ['RELEASE_VERSION'],
              'release_tag': os.environ['RELEASE_TAG'],
              'source_commit': os.environ['SOURCE_SHA'],
              'content_identity': os.environ['EXPECTED_CONTENT_IDENTITY'],
              'transport_sha256': os.environ['EXPECTED_TRANSPORT_SHA256'],
              'release_assets': assets,
              'asset_count': len(assets),
              'workflow_run': os.environ['GITHUB_RUN_ID'],
              'dogfood_update_workflow_run': '32421398161',
              'main_install_merge': 'ea321c4e77de6e179d6afdb73b132141ac2e971d',
          }
          Path('release-evidence/v0.5.0-publication.json').write_text(json.dumps(receipt, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- release-evidence/v0.5.0-publication.json
          git diff --cached --check
          git commit -m 'release: record v0.5.0 publication receipt'
          git push origin HEAD:release/publish-v0.5.0
