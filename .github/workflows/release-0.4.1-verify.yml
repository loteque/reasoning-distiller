name: Verify Reasoning Distiller 0.4.1 Release

on:
  push:
    branches: [release-0.4.1-verify]
    paths:
      - '.github/workflows/release-0.4.1-verify.yml'

permissions:
  contents: write

env:
  RELEASE_VERSION: '0.4.1'
  RELEASE_TAG: 'v0.4.1'
  SOURCE_SHA: '3f6211f2003a3875f8e0c19739616cdf8ced1f6b'
  EXPECTED_CONTENT_IDENTITY: 'sha256:9d5fcd82629dc4c696ec11336af0a7bbbdd3f30e0536dd227d202039ce28a9bb'
  EXPECTED_TRANSPORT_SHA256: '1ff471c9f6b26152a1dd0052d7a0a996616854955a676137e1c6720bb1bc172e'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release-0.4.1-verify
          persist-credentials: true
      - name: Wait for and verify immutable release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 24); do
            if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then break; fi
            sleep 5
          done
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null
          tag_sha="$(git ls-remote --tags "https://github.com/${GITHUB_REPOSITORY}.git" "refs/tags/$RELEASE_TAG" | awk '{print $1}')"
          test "$tag_sha" = "$SOURCE_SHA"
          rm -rf /tmp/verify-release && mkdir -p /tmp/verify-release
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir /tmp/verify-release
          find /tmp/verify-release -maxdepth 1 -type f -printf '%f\n' | sort > /tmp/actual-assets.txt
          printf '%s\n' install-package-manifest.schema.json installation-record.schema.json rd_install.py "reasoning-distiller-${RELEASE_VERSION}.manifest.json" "reasoning-distiller-${RELEASE_VERSION}.sha256" "reasoning-distiller-${RELEASE_VERSION}.tar.gz" validate_install_package_contract.py | sort > /tmp/expected-assets.txt
          diff -u /tmp/expected-assets.txt /tmp/actual-assets.txt
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root=Path('/tmp/verify-release')
          manifest=json.loads((root/f'reasoning-distiller-{os.environ["RELEASE_VERSION"]}.manifest.json').read_text(encoding='utf-8'))
          detached=(root/f'reasoning-distiller-{os.environ["RELEASE_VERSION"]}.sha256').read_text(encoding='utf-8').split()[0]
          assert manifest['content_identity'] == os.environ['EXPECTED_CONTENT_IDENTITY']
          assert manifest['source_commit'] == os.environ['SOURCE_SHA']
          assert detached == os.environ['EXPECTED_TRANSPORT_SHA256']
          assert len(manifest['files']) == 49
          PY
      - name: Persist verification PASS
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-candidate
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          status={
            'contract':'reasoning-distiller-release-verification-status/1',
            'status':'PASS',
            'release_version':os.environ['RELEASE_VERSION'],
            'release_tag':os.environ['RELEASE_TAG'],
            'source_commit':os.environ['SOURCE_SHA'],
            'content_identity':os.environ['EXPECTED_CONTENT_IDENTITY'],
            'transport_sha256':os.environ['EXPECTED_TRANSPORT_SHA256'],
            'asset_count':7,
            'workflow_run':os.environ['GITHUB_RUN_ID'],
          }
          Path('release-candidate/0.4.1-verified.json').write_text(json.dumps(status,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- release-candidate/0.4.1-verified.json
          git commit -m 'release: verify Reasoning Distiller 0.4.1'
          git push origin HEAD:release-0.4.1-verify
