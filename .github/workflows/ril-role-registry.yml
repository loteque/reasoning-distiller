name: RIL Role Registry

on:
  push:
    branches: [main]
    paths:
      - "runtime/ril_roles.py"
      - "runtime/ril_mutation.py"
      - "runtime/ril_operators.py"
      - "runtime/ril_operator_management.py"
      - "tests/test_ril_roles.py"
      - "docs/operations/RIL_ROLE_REGISTRY_CONTRACT.md"
      - ".github/workflows/ril-role-registry.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run R6 role-registry conformance suite
        run: python -m unittest tests.test_ril_roles -v
      - name: Compile R6 primitive
        run: python -m py_compile runtime/ril_roles.py runtime/ril_mutation.py runtime/ril_operators.py runtime/ril_operator_management.py
