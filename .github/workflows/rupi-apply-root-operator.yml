name: Apply confirmed Rupi root operator

on:
  push:
    branches:
      - rupi/apply-root-operator
    paths:
      - '.github/workflows/rupi-apply-root-operator.yml'

permissions:
  contents: write

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout authority branch
        uses: actions/checkout@v4
        with:
          ref: rupi/apply-root-operator
          fetch-depth: 1
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply exact confirmed root proposal through Rupi
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import sys
          from pathlib import Path

          root = Path('.').resolve()
          runtime = root / '.reasoning-distiller' / 'runtime'
          sys.path.insert(0, str(runtime))

          import rupi_authority

          result = rupi_authority.confirm_initial_root(
              root,
              operator_id='operator:loteque',
              proposal_reference='proposal:b7488df4cc3d8002078fc5103d256810223a4f57318a7df201bcd9759edf57d8',
              confirmation='ESTABLISH_ROOT_OPERATOR',
              requested_goal='initialize Reasoning Distiller project authority on main',
          )
          print(json.dumps(result, indent=2, sort_keys=True))
          assert result['status'] == 'PASS', result
          assert result['outcome'] == 'INITIAL_ROOT_ESTABLISHED', result
          status = result['checkpoint']['status']
          assert status['dimensions']['operator'] == 'VALID', status
          assert status['dimensions']['reconciliation_authority'] == 'UNASSIGNED', status
          assert status['dimensions']['admission_authority'] == 'UNASSIGNED', status
          PY

      - name: Verify mutation scope
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git status --porcelain=v1 | awk '{print $2}')"
          test -n "$changed"
          while IFS= read -r path; do
            case "$path" in
              project-knowledge/*) ;;
              *) echo "unexpected Rupi authority mutation: $path" >&2; exit 1 ;;
            esac
          done <<< "$changed"

      - name: Commit primitive-owned authority artifacts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- project-knowledge
          git diff --cached --check
          git commit -m 'rupi: establish operator:loteque as protected root'
          git push origin HEAD:rupi/apply-root-operator
