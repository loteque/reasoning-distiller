name: Install Reasoning Distiller v0.4.0

on:
  workflow_dispatch:
    inputs:
      confirm_install:
        description: Confirm the pinned v0.4.0 installation
        required: true
        type: choice
        options:
          - INSTALL_V0_4_0

permissions:
  contents: write

concurrency:
  group: reasoning-distiller-self-install-v0.4.0-${{ github.ref }}
  cancel-in-progress: false

env:
  RELEASE_VERSION: '0.4.0'
  RELEASE_TAG: 'v0.4.0'
  RELEASE_SOURCE_SHA: '6259324d030822ac78da902f9288f18e8f071b84'
  EXPECTED_CONTENT_IDENTITY: 'sha256:f947fa0f4554a4bc46275a78b8e03f8dcaa8959324557243422400b49d1a7869'
  EXPECTED_TRANSPORT_SHA256: '2ce8a58d1b4278d906f560ccce07c568573be1f87f667976330fac3e92369d54'

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse direct installation on default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_NAME" = "$DEFAULT_BRANCH" ]; then
            echo "Refusing to install directly on the default branch. Dispatch this workflow on a dedicated install branch." >&2
            exit 1
          fi

      - name: Checkout selected install branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned installer dependency
        run: python -m pip install --disable-pip-version-check jsonschema==4.25.1

      - name: Retrieve exact release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          RD_TMP="$RUNNER_TEMP/reasoning-distiller-${RELEASE_VERSION}"
          RAW="$RD_TMP/raw"
          mkdir -p "$RAW" "$RD_TMP/packaging" "$RD_TMP/schemas"

          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --dir "$RAW" \
            --pattern "reasoning-distiller-${RELEASE_VERSION}.tar.gz" \
            --pattern "reasoning-distiller-${RELEASE_VERSION}.manifest.json" \
            --pattern "reasoning-distiller-${RELEASE_VERSION}.sha256" \
            --pattern "rd_install.py" \
            --pattern "validate_install_package_contract.py" \
            --pattern "install-package-manifest.schema.json" \
            --pattern "installation-record.schema.json"

          test "$(find "$RAW" -maxdepth 1 -type f | wc -l)" -eq 7

          mv "$RAW/rd_install.py" "$RD_TMP/packaging/rd_install.py"
          mv "$RAW/validate_install_package_contract.py" "$RD_TMP/packaging/validate_install_package_contract.py"
          mv "$RAW/install-package-manifest.schema.json" "$RD_TMP/schemas/install-package-manifest.schema.json"
          mv "$RAW/installation-record.schema.json" "$RD_TMP/schemas/installation-record.schema.json"

          echo "RD_TMP=$RD_TMP" >> "$GITHUB_ENV"
          echo "RD_ARCHIVE=$RAW/reasoning-distiller-${RELEASE_VERSION}.tar.gz" >> "$GITHUB_ENV"
          echo "RD_MANIFEST=$RAW/reasoning-distiller-${RELEASE_VERSION}.manifest.json" >> "$GITHUB_ENV"
          echo "RD_SHA_FILE=$RAW/reasoning-distiller-${RELEASE_VERSION}.sha256" >> "$GITHUB_ENV"

      - name: Verify release identities
        shell: bash
        run: |
          set -euo pipefail
          actual_transport="$(sha256sum "$RD_ARCHIVE" | awk '{print $1}')"
          detached_transport="$(awk '{print $1}' "$RD_SHA_FILE")"
          test "$actual_transport" = "$EXPECTED_TRANSPORT_SHA256"
          test "$detached_transport" = "$EXPECTED_TRANSPORT_SHA256"

          python "$RD_TMP/packaging/validate_install_package_contract.py" --manifest "$RD_MANIFEST"

          python3 - "$RD_MANIFEST" <<'PY'
          import json, os, sys
          manifest = json.load(open(sys.argv[1], encoding='utf-8'))
          assert manifest['version'] == os.environ['RELEASE_VERSION']
          assert manifest['source_commit'] == os.environ['RELEASE_SOURCE_SHA']
          assert manifest['content_identity'] == os.environ['EXPECTED_CONTENT_IDENTITY']
          assert manifest['transport_sha256'] == os.environ['EXPECTED_TRANSPORT_SHA256']
          print('PASS exact v0.4.0 release identities verified')
          PY

      - name: Install release into repository
        shell: bash
        run: |
          set -euo pipefail
          python "$RD_TMP/packaging/rd_install.py" \
            --package "$RD_ARCHIVE" \
            --manifest "$RD_MANIFEST" \
            --transport-sha256 "$EXPECTED_TRANSPORT_SHA256" \
            --target "$GITHUB_WORKSPACE" \
            --source-repository "$GITHUB_REPOSITORY" \
            --source-locator "$RELEASE_TAG"

      - name: Validate installed tree and write boundary
        shell: bash
        run: |
          set -euo pipefail
          test -d .reasoning-distiller
          cmp "$RD_MANIFEST" .reasoning-distiller/.installation/MANIFEST.json
          python "$RD_TMP/packaging/validate_install_package_contract.py" \
            --installation .reasoning-distiller/.installation/INSTALLATION.json

          unexpected="$(git status --porcelain=v1 --untracked-files=all | grep -vE '^.. \.reasoning-distiller/' || true)"
          if [ -n "$unexpected" ]; then
            echo "Installer changed paths outside .reasoning-distiller/:" >&2
            printf '%s\n' "$unexpected" >&2
            exit 1
          fi

      - name: Commit installed managed tree to selected branch
        shell: bash
        run: |
          set -euo pipefail
          git add -- .reasoning-distiller
          git diff --cached --check

          if git diff --cached --quiet; then
            echo "No installation changes to commit."
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "install: Reasoning Distiller ${RELEASE_TAG}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
