name: P5 d96071ab Engineer candidate evidence

on:
  push:
    branches:
      - evidence/context-packaging-p5-d96071ab-engineer-20260824

permissions:
  contents: read

jobs:
  p5-engineer-evidence:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact P5 remediation semantic candidate
        uses: actions/checkout@v4
        with:
          ref: d96071ab833179948e5f9526cdb63c15c6451ff4
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check pytest jsonschema==4.25.1 referencing PyYAML==6.0.2

      - name: Verify exact candidate identity and P5 remediation blobs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "d96071ab833179948e5f9526cdb63c15c6451ff4"
          test "$(git rev-parse HEAD^)" = "8abe0fb4f96f12fa6ed9503a99753d93442cdf0e"
          test "$(git rev-parse HEAD:context_packaging/pack_builder.py)" = "c7a87dae852de2cb58393fa3bc6dd9241a2155f0"
          test "$(git rev-parse HEAD:context_packaging/pack_builder_v1.py)" = "b0e806e966598e6d819b6d52c643efa23cdb6ef9"
          test "$(git rev-parse HEAD:tests/test_context_packaging_pack_builder_p5.py)" = "5fd7fc17a01877f4add060357a6b28ee0eb0e096"
          test "$(git rev-parse HEAD:context_packaging/__init__.py)" = "a70ce6a24ab64efb8171bd95c7907fa22b7de63f"
          test "$(git rev-parse HEAD:docs/design/CONTEXT_PACKAGING_PURE_PACK_BUILDER_P5_REMEDIATION.md)" = "0e23bb010f61b0765f63d3db291444bd3088478d"
          {
            echo "candidate=$(git rev-parse HEAD)"
            echo "parent=$(git rev-parse HEAD^)"
            echo "builder_v2_dispatch_blob=$(git rev-parse HEAD:context_packaging/pack_builder.py)"
            echo "builder_v1_preserved_blob=$(git rev-parse HEAD:context_packaging/pack_builder_v1.py)"
            echo "p5_test_blob=$(git rev-parse HEAD:tests/test_context_packaging_pack_builder_p5.py)"
            echo "init_blob=$(git rev-parse HEAD:context_packaging/__init__.py)"
            echo "remediation_note_blob=$(git rev-parse HEAD:docs/design/CONTEXT_PACKAGING_PURE_PACK_BUILDER_P5_REMEDIATION.md)"
          } | tee p5-candidate-identity.txt

      - name: Run exact P5 remediation suite
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_context_packaging_pack_builder_p5.py 2>&1 | tee p5-gate.txt

      - name: Run unaffected P1-P4 and closed amendment context-packaging regressions
        shell: bash
        run: |
          set -euo pipefail
          tests=()
          for test_file in tests/test_context_packaging_*.py; do
            case "$test_file" in
              tests/test_context_packaging_protocol_schemas_p1b.py|tests/test_context_packaging_pack_builder_p5.py) continue ;;
            esac
            tests+=("$test_file")
          done
          printf '%s\n' "${tests[@]}" | tee p1-p4-amendment-regression-files.txt
          python -m pytest -q "${tests[@]}" 2>&1 | tee p1-p4-amendment-regressions.txt

      - name: Run P5 blocker-remediation pressure probes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' | tee p5-remediation-probes.txt
          import copy
          from context_packaging import ProjectedKnowledge
          from tests.test_context_packaging_pack_builder_p5 import _build, _fixture, _upper_sha

          baseline = _build(_fixture(semantic_item=True))
          assert baseline.ok, baseline.failure

          fx = _fixture(semantic_item=True)
          canonical = copy.deepcopy(fx['sources'][1].binding)
          canonical['pems_sha256'] = _upper_sha(canonical['pems_sha256'])
          fx['sources'][1] = type(fx['sources'][1])(canonical, fx['sources'][1].content)
          projected = fx['projected'][0]
          projected_ref = copy.deepcopy(projected.canonical_snapshot_ref)
          projected_ref['pems_sha256'] = _upper_sha(projected_ref['pems_sha256'])
          fx['projected'] = [ProjectedKnowledge(projected_ref, projected.pems, projected.causes)]
          normalized = _build(fx)
          assert normalized.ok, normalized.failure
          assert normalized.serialized_pack == baseline.serialized_pack
          emitted = next(item for item in normalized.pack['source_registry'] if item['source_class'] == 'canonical_state')['pems_sha256']
          assert emitted == emitted.lower()
          print('P5_LOWERCASE_SHA_REMEDIATION_PASS source_registry.pems_sha256=' + emitted)

          collision = _build(_fixture(collision=True))
          assert collision.ok, collision.failure
          refs = {
              (entry['subject']['pems_ref']['namespace'], entry['subject']['pems_ref']['id'])
              for entry in collision.pack['inclusion_ledger']
              if entry['plane'] == 'knowledge' and 'pems_ref' in entry['subject']
          }
          assert ('record', 'shared') in refs
          assert ('relation', 'shared') in refs
          print('P5_NAMESPACED_PROVENANCE_REMEDIATION_PASS refs=' + repr(sorted(refs)))
          PY

      - name: Preserve inherited red 1 - P1b PS-19 classifier mismatch
        shell: bash
        run: |
          set +e
          python -m pytest -q tests/test_context_packaging_protocol_schemas_p1b.py > inherited-red-p1b-ps19.txt 2>&1
          status=$?
          set -e
          cat inherited-red-p1b-ps19.txt
          echo "exit_status=$status" | tee inherited-red-p1b-ps19.status

      - name: Preserve inherited red 2 - legacy runtime-isolation schema issue
        shell: bash
        run: |
          set +e
          python -m unittest -v tests/test_runtime_isolation_p5.py > inherited-red-runtime-isolation.txt 2>&1
          status=$?
          set -e
          cat inherited-red-runtime-isolation.txt
          echo "exit_status=$status" | tee inherited-red-runtime-isolation.status

      - name: Preserve inherited red 3 - extraction-parity Distiller directive issue
        shell: bash
        run: |
          set +e
          python tests/check_corpus_integrity.py > inherited-red-extraction-parity.txt 2>&1
          status=$?
          set -e
          cat inherited-red-extraction-parity.txt
          actual="$(git rev-parse HEAD:agents/distiller/DIRECTIVE.md)"
          expected="$(python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path('docs/extraction/copied-artifacts.json').read_text(encoding='utf-8'))
          item = next(x for x in manifest['artifacts'] if x['destination'] == 'agents/distiller/DIRECTIVE.md')
          print(item['source_blob_sha'])
          PY
          )"
          {
            echo "exit_status=$status"
            echo "distiller_directive_expected_blob=$expected"
            echo "distiller_directive_actual_blob=$actual"
          } | tee inherited-red-extraction-parity.status

      - name: Upload candidate-bound Engineer evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p5-d96071ab-engineer-evidence
          path: |
            p5-candidate-identity.txt
            p5-gate.txt
            p1-p4-amendment-regression-files.txt
            p1-p4-amendment-regressions.txt
            p5-remediation-probes.txt
            inherited-red-p1b-ps19.txt
            inherited-red-p1b-ps19.status
            inherited-red-runtime-isolation.txt
            inherited-red-runtime-isolation.status
            inherited-red-extraction-parity.txt
            inherited-red-extraction-parity.status
          if-no-files-found: error
