name: P10 G4 0e122816 Engineer evidence

on:
  pull_request:
    branches:
      - impl/p10-g4-prepare-integration-20260825

permissions:
  contents: read

jobs:
  g4-prepare-integration:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact G4 semantic candidate
        uses: actions/checkout@v4
        with:
          ref: 0e122816ea09271a54660bb218bce8d49986dcf1
          fetch-depth: 0
      - name: Set up exact P9 runtime
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.0"
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check pytest jsonschema==4.25.1 referencing PyYAML==6.0.2
      - name: Verify immutable candidate, G3 base, bounded delta, and exact ABI
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "0e122816ea09271a54660bb218bce8d49986dcf1"
          test "$(git merge-base HEAD 48e272e35f902a9f6e0ee4111e6220cbcef1d7cd)" = "48e272e35f902a9f6e0ee4111e6220cbcef1d7cd"
          expected_delta=$'context_packaging/prepare_integration.py\nruntime/rd_distill.py\ntests/test_context_packaging_production_integration_p10_g4.py'
          test "$(git diff --name-only 48e272e35f902a9f6e0ee4111e6220cbcef1d7cd..HEAD)" = "$expected_delta"
          python - <<'PY'
          import sys
          assert sys.implementation.name == 'cpython'
          assert sys.version_info[:3] == (3, 12, 0), sys.version
          assert sys.implementation.cache_tag == 'cpython-312', sys.implementation.cache_tag
          print('P10_G4_EXACT_RUNTIME_PASS')
          PY
          python -m py_compile context_packaging/prepare_integration.py runtime/rd_distill.py tests/test_context_packaging_production_integration_p10_g4.py
      - name: Run exact G4 prepare gate
        run: python -m pytest -q tests/test_context_packaging_production_integration_p10_g4.py

  g4-package-persistence-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 0e122816ea09271a54660bb218bce8d49986dcf1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.0"
      - run: python -m pip install --disable-pip-version-check pytest jsonschema==4.25.1 referencing PyYAML==6.0.2
      - name: Verify exact candidate
        run: test "$(git rev-parse HEAD)" = "0e122816ea09271a54660bb218bce8d49986dcf1"
      - name: Run G2 G3 package and persistence regressions
        run: python -m pytest -q tests/test_context_packaging_production_integration_p10_g2.py tests/test_context_packaging_production_integration_p10_g3.py tests/test_context_packaging_persistence_adapter_p6.py tests/test_package_builder.py tests/test_install_package_contract.py tests/test_installer_p3.py tests/test_installer_p4.py

  g4-predecessor-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 0e122816ea09271a54660bb218bce8d49986dcf1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.0"
      - run: python -m pip install --disable-pip-version-check pytest jsonschema==4.25.1 referencing PyYAML==6.0.2
      - name: Run G0-G3, P9, and fixed production regressions
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "0e122816ea09271a54660bb218bce8d49986dcf1"
          python -m pytest -q \
            tests/test_context_packaging_production_integration_p10_g0.py \
            tests/test_context_packaging_production_integration_p10_g1.py \
            tests/test_context_packaging_production_integration_p10_g2.py \
            tests/test_context_packaging_production_integration_p10_g3.py \
            tests/test_context_packaging_renderer_identity_protocol_freeze_p9r1.py \
            tests/test_context_packaging_renderer_closed_bundle_p9r2.py \
            tests/test_context_packaging_renderer_execution_binding_p9r3.py \
            tests/test_context_packaging_deterministic_renderer_p9.py \
            tests/test_context_packaging_renderer_ri15_remediation.py \
            tests/test_production_invocation.py
