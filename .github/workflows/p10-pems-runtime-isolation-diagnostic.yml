name: P10 packaged PEMS remediation diagnostic

on:
  push:
    branches:
      - evidence/p10-pems-runtime-isolation-824c812e-20260826

permissions:
  contents: read

jobs:
  focused-suite:
    strategy:
      fail-fast: false
      matrix:
        target:
          - remediation
          - runtime-isolation
          - package-builder
          - protocol-v1
          - protocol-v2
          - g7-v1-compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 824c812ed6ffe79b6a9afe7bfc9c1f6eab656a27
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.0"
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check pytest jsonschema==4.25.1 referencing PyYAML==6.0.2
      - name: Run ${{ matrix.target }}
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.target }}" in
            remediation) python -m pytest -q tests/test_p10_packaged_pems_runtime_isolation_remediation.py ;;
            runtime-isolation) python -m pytest -q tests/test_runtime_isolation_p5.py ;;
            package-builder) python -m pytest -q tests/test_package_builder.py ;;
            protocol-v1) python -m pytest -q tests/test_context_packaging_protocol_schemas_p1b.py ;;
            protocol-v2) python -m pytest -q tests/test_context_packaging_protocol_schemas_v2.py ;;
            g7-v1-compatibility) python -m pytest -q tests/test_context_packaging_production_integration_p10_g7.py::test_p10_g7_explicit_v2_selection_preserves_v1_and_contract_rollback ;;
          esac
