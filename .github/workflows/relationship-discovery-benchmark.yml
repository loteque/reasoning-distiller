name: Relationship Discovery Benchmark

on:
  pull_request:
    paths:
      - ".github/workflows/relationship-discovery-benchmark.yml"
      - "evaluation/relationship_discovery_benchmark.py"
      - "evaluation/relationship_analysis_result.py"
      - "evaluation/relationship_discovery_closeout.py"
      - "evaluation/relationship_discovery_reconciliation.py"
      - "evaluation/relationship_discovery_materialize_reconciliation.py"
      - "evaluation/relationship-discovery/**"
      - "tests/test_relationship*.py"
      - "project-knowledge/reconciliation/activation-evidence/**"
      - "project-knowledge/canonical/pems2.jcs.json"
      - "project-knowledge/canonical/cove1.jcs.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  a0-inputs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run focused benchmark tests
        run: python -m unittest discover -s tests -p 'test_relationship*.py' -v

      - name: Freeze A0 coverage and materialize semantic batches
        run: |
          set -euo pipefail
          artifact=/tmp/relationship-discovery-a0
          mkdir -p "$artifact/batches"
          python evaluation/relationship_discovery_benchmark.py bootstrap \
            --pems project-knowledge/canonical/pems2.jcs.json \
            --benchmark evaluation/relationship-discovery/benchmark-v1/benchmark.json \
            --coverage-out "$artifact/coverage.json"
          python evaluation/relationship_discovery_benchmark.py verify-coverage "$artifact/coverage.json"
          python - <<'PY'
          import importlib.util
          import json
          from pathlib import Path

          root = Path('.')
          module_path = root / 'evaluation' / 'relationship_discovery_benchmark.py'
          spec = importlib.util.spec_from_file_location('relationship_discovery_benchmark', module_path)
          bench = importlib.util.module_from_spec(spec)
          assert spec.loader is not None
          spec.loader.exec_module(bench)

          artifact = Path('/tmp/relationship-discovery-a0')
          coverage = json.loads((artifact / 'coverage.json').read_text(encoding='utf-8'))
          pems_bytes = (root / 'project-knowledge' / 'canonical' / 'pems2.jcs.json').read_bytes()
          for batch in coverage['batches']:
              payload = bench.materialize_batch(pems_bytes, coverage, batch['batch_id'])
              path = artifact / 'batches' / f"{batch['batch_id']}.json"
              path.write_bytes(bench.canonical_json_bytes(payload) + b'\n')
          batch_files = sorted((artifact / 'batches').glob('A0-B??-B??.json'))
          if len(batch_files) != 78:
              raise SystemExit(f'expected 78 materialized batches, found {len(batch_files)}')
          print(f'PASS materialized {len(batch_files)} A0 batches')
          PY

      - name: Validate persisted semantic batch results
        run: |
          set -euo pipefail
          shopt -s nullglob
          results=(evaluation/relationship-discovery/benchmark-v1/baseline/A0-exhaustive/batches/*.result.json)
          for result in "${results[@]}"; do
            name="$(basename "$result" .result.json)"
            python evaluation/relationship_analysis_result.py \
              --batch "/tmp/relationship-discovery-a0/batches/${name}.json" \
              --result "$result"
          done
          echo "PASS validated ${#results[@]} persisted A0 semantic batch result(s)"

      - name: Build complete A0 closeout
        id: closeout
        run: |
          set -euo pipefail
          result_dir=evaluation/relationship-discovery/benchmark-v1/baseline/A0-exhaustive/batches
          result_count="$(find "$result_dir" -maxdepth 1 -type f -name 'A0-B??-B??.result.json' | wc -l | tr -d ' ')"
          if [ "$result_count" -ne 78 ]; then
            echo "complete=false" >> "$GITHUB_OUTPUT"
            echo "SKIP A0 closeout: expected 78 results, found $result_count"
            exit 0
          fi

          out=/tmp/relationship-discovery-a0-closeout
          python evaluation/relationship_discovery_closeout.py build \
            --coverage /tmp/relationship-discovery-a0/coverage.json \
            --batch-dir /tmp/relationship-discovery-a0/batches \
            --result-dir "$result_dir" \
            --report-template evaluation/relationship-discovery/benchmark-v1/baseline/A0-exhaustive/report.json \
            --out-dir "$out"

          persisted=evaluation/relationship-discovery/benchmark-v1/baseline/A0-exhaustive
          if [ -f "$persisted/coverage.json" ] || [ -f "$persisted/candidates.json" ]; then
            artifact_names=(coverage.json candidates.json)
            for name in "${artifact_names[@]}"; do
              if [ ! -f "$persisted/$name" ]; then
                echo "FAIL persisted A0 closeout is missing $name" >&2
                exit 1
              fi
              cmp "$out/$name" "$persisted/$name"
            done
            if [ ! -f "$persisted/steward-dispositions.json" ]; then
              cmp "$out/report.json" "$persisted/report.json"
              cmp "$out/report.md" "$persisted/report.md"
              echo "PASS persisted pre-reconciliation A0 closeout exactly matches deterministic regeneration"
            else
              echo "PASS persisted A0 coverage and candidate set exactly match deterministic regeneration"
            fi
          fi
          echo "complete=true" >> "$GITHUB_OUTPUT"

      - name: Validate completed Steward reconciliation
        if: steps.closeout.outputs.complete == 'true'
        run: |
          set -euo pipefail
          base=evaluation/relationship-discovery/benchmark-v1/baseline/A0-exhaustive
          activation=project-knowledge/reconciliation/activation-evidence/a81360a9a4ab349a377dd378b5ed55e7e4a28d45ca26f6de51888dfac477928b.json
          if [ ! -f "$base/steward-selection.json" ] || [ ! -f "$base/steward-dispositions.json" ]; then
            echo "FAIL complete A0 reconciliation evidence is missing" >&2
            exit 1
          fi

          python evaluation/relationship_discovery_reconciliation.py validate \
            --candidates "$base/candidates.json" \
            --result-dir "$base/batches" \
            --activation "$activation" \
            --dispositions "$base/steward-dispositions.json"

          python evaluation/relationship_discovery_materialize_reconciliation.py \
            --candidates "$base/candidates.json" \
            --result-dir "$base/batches" \
            --activation "$activation" \
            --selection "$base/steward-selection.json" \
            --out /tmp/steward-dispositions.json
          cmp /tmp/steward-dispositions.json "$base/steward-dispositions.json"

          python evaluation/relationship_discovery_benchmark.py validate-report "$base/report.json"
          python evaluation/relationship_discovery_benchmark.py render-report \
            "$base/report.json" --out /tmp/a0-report.md
          cmp /tmp/a0-report.md "$base/report.md"

          python - <<'PY'
          import json
          from pathlib import Path

          base = Path('evaluation/relationship-discovery/benchmark-v1/baseline/A0-exhaustive')
          dispositions = json.loads((base / 'steward-dispositions.json').read_text(encoding='utf-8'))
          report = json.loads((base / 'report.json').read_text(encoding='utf-8'))
          if dispositions['reviewed_candidate_count'] != 1128:
              raise SystemExit('reviewed candidate count mismatch')
          if dispositions['recommended_relation_count'] != 668:
              raise SystemExit('approved baseline relation count mismatch')
          if dispositions['recommended_relations_digest'] != 'sha256:ab07f98f8e280a7008d60b12b31e0376eec3ea761b70979ffae32a39482b8efd':
              raise SystemExit('approved baseline relation digest mismatch')
          if report['verdict'] != 'PASS':
              raise SystemExit('A0 report is not PASS after reconciliation')
          if report['metrics']['baseline_relations'].get('value') != 668:
              raise SystemExit('A0 report baseline count mismatch')
          print('PASS completed A0 Steward reconciliation is deterministic and report-bound')
          PY

      - name: Upload immutable A0 analysis inputs
        uses: actions/upload-artifact@v4
        with:
          name: relationship-discovery-a0-inputs
          path: /tmp/relationship-discovery-a0
          if-no-files-found: error
          retention-days: 14

      - name: Upload deterministic A0 closeout
        if: steps.closeout.outputs.complete == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: relationship-discovery-a0-closeout
          path: /tmp/relationship-discovery-a0-closeout
          if-no-files-found: error
          retention-days: 14
