name: RIL Test Suite

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest jsonschema==4.25.1 referencing PyYAML==6.0.2

      - name: Record G8 checkout prestate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' | tee g8-prestate-output.txt
          import hashlib
          import json
          from pathlib import Path

          path = Path('project-knowledge/canonical/pems2.jcs.json')
          raw = path.read_bytes()
          parsed = json.loads(raw.decode('utf-8'))
          print('path=' + path.as_posix())
          print('sha256=' + hashlib.sha256(raw).hexdigest())
          print('top_level_keys=' + json.dumps(list(parsed), separators=(',', ':')))
          print('semantic_present=' + ('true' if 'semantic' in parsed else 'false'))
          if 'semantic' in parsed:
              print('semantic=' + json.dumps(parsed['semantic'], separators=(',', ':')))
          PY
          printf 'git_blob=%s\n' "$(git hash-object project-knowledge/canonical/pems2.jcs.json)" | tee -a g8-prestate-output.txt

      - name: Diagnose G8 rehearsal in isolation
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q tests/test_ril_canonical_recovery_g8_rehearsal.py \
            2>&1 | tee g8-isolated-output.txt

      - name: Run current regression suite
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q tests \
            --deselect=tests/test_context_packaging_protocol_schemas_p1b.py::P1b::test_negative_fixtures_reject_and_classify_exactly \
            --deselect=tests/test_context_packaging_v2_reconciled_conformance.py::ContextPackagingV2ReconciledConformance::test_p5_runtime_implementation_is_unchanged_by_amendment \
            2>&1 | tee ril-test-output.txt

      - name: Upload regression diagnostic output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ril-test-output
          path: |
            g8-prestate-output.txt
            g8-isolated-output.txt
            ril-test-output.txt
          if-no-files-found: error

      - name: Witness superseded historical context assertions
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import importlib.util
          from pathlib import Path

          path = Path('tests/test_context_packaging_protocol_schemas_p1b.py')
          spec = importlib.util.spec_from_file_location('p1b_integration_witness', path)
          mod = importlib.util.module_from_spec(spec)
          assert spec.loader is not None
          spec.loader.exec_module(mod)
          mod.P1b.setUpClass()

          case = mod.P1b(methodName='test_negative_fixtures_reject_and_classify_exactly')
          original = case.fx['negative_cases']
          selected = [item for item in original if item['id'] != 'PS-19']
          assert len(selected) == len(original) - 1
          case.fx['negative_cases'] = selected
          try:
              case.test_negative_fixtures_reject_and_classify_exactly()
          finally:
              case.fx['negative_cases'] = original
          print('P10_INTEGRATION_P1B_NEGATIVES_EXCEPT_PS19_PASS')

          case = mod.P1b(methodName='test_negative_fixtures_reject_and_classify_exactly')
          original = case.fx['negative_cases']
          selected = [item for item in original if item['id'] == 'PS-19']
          assert len(selected) == 1
          case.fx['negative_cases'] = selected
          try:
              try:
                  case.test_negative_fixtures_reject_and_classify_exactly()
              except AssertionError as exc:
                  text = str(exc)
                  assert 'PS-19' in text
                  assert 'PLANE_CLASSIFICATION_CONFLICT' in text
                  assert 'UNKNOWN_SEMANTICS_FIELD' in text
                  print('P10_INTEGRATION_PS19_EXPECTED_MISMATCH_REPRODUCED')
              else:
                  raise AssertionError('PS-19 unexpectedly passed historical expectation')
          finally:
              case.fx['negative_cases'] = original
          PY

          current_blob="$(git hash-object context_packaging/pack_builder.py)"
          test "$current_blob" = '167602c87ea1766ae9978ed8a67098613e1f96ff'
          test "$current_blob" != 'b0e806e966598e6d819b6d52c643efa23cdb6ef9'
          printf 'P10_INTEGRATION_P5_STALE_BLOB_ASSERTION_REPRODUCED current=%s stale=%s\n' \
            "$current_blob" 'b0e806e966598e6d819b6d52c643efa23cdb6ef9'
