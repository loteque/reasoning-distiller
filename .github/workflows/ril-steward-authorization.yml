name: RIL R7 Steward Authorization

on:
  push:
    branches: [main]
    paths:
      - 'runtime/ril_steward_authorization.py'
      - 'runtime/ril_roles.py'
      - 'runtime/ril_operators.py'
      - 'runtime/ril_mutation.py'
      - 'tests/test_ril_steward_authorization.py'
      - 'docs/operations/RIL_STEWARD_AUTHORIZATION_CONTRACT.md'
      - '.github/workflows/ril-steward-authorization.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run R7 Steward-authorization conformance suite
        run: python -m unittest tests/test_ril_steward_authorization.py -v
      - name: Compile R7 primitive
        run: python -m py_compile runtime/ril_steward_authorization.py
