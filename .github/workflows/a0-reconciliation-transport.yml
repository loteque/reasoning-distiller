name: A0 Reconciliation Transport

on:
  pull_request:
    paths:
      - ".github/workflows/a0-reconciliation-transport.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-results:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload immutable A0 semantic results
        uses: actions/upload-artifact@v4
        with:
          name: relationship-discovery-a0-results
          path: evaluation/relationship-discovery/benchmark-v1/baseline/A0-exhaustive/batches/*.result.json
          if-no-files-found: error
          retention-days: 1
