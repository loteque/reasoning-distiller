name: RIL R13 Admission

on:
  push:
    branches: [main]
    paths:
      - 'runtime/ril_admission.py'
      - 'runtime/ril_reconciliation.py'
      - 'runtime/ril_activation.py'
      - 'runtime/ril_steward_authorization.py'
      - 'runtime/ril_roles.py'
      - 'runtime/ril_operators.py'
      - 'runtime/ril_mutation.py'
      - 'tests/test_ril_admission.py'
      - 'docs/operations/RIL_ADMISSION_CONTRACT.md'
      - '.github/workflows/ril-admission.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run R13 admission conformance suite
        run: python -m unittest tests/test_ril_admission.py -v
      - name: Compile R13 primitive
        run: python -m py_compile runtime/ril_admission.py
