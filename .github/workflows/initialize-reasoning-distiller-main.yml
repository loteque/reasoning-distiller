name: Initialize Reasoning Distiller on main

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/initialize-reasoning-distiller-main.yml'

permissions:
  contents: write

concurrency:
  group: initialize-reasoning-distiller-main
  cancel-in-progress: false

jobs:
  initialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Bootstrap installed Reasoning Distiller
        shell: bash
        run: |
          set -Eeuo pipefail
          python .reasoning-distiller/runtime/rd_bootstrap.py --target . | tee /tmp/rd-bootstrap-result.json
          python - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(Path('/tmp/rd-bootstrap-result.json').read_text(encoding='utf-8'))
          assert result['contract'] == 'reasoning-distiller-project-bootstrap-result/1'
          assert result['status'] == 'PASS'
          assert result['project_contract'] == 'reasoning-distiller-project/1'
          assert result['outcome'] in {'CREATED', 'COMPLETED', 'ALREADY_BOOTSTRAPPED'}

          expected = {
              'contract': 'reasoning-distiller-project/1',
              'paths': {
                  'evidence': 'project-knowledge/evidence',
                  'invocations': 'project-knowledge/invocations',
                  'submissions': 'project-knowledge/submissions',
              },
          }
          actual = json.loads(Path('project-knowledge/project.json').read_text(encoding='utf-8'))
          assert actual == expected
          print('PASS Reasoning Distiller project bootstrap')
          PY

      - name: Commit initialized project state and remove one-shot workflow
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add -- project-knowledge/project.json
          git rm -- .github/workflows/initialize-reasoning-distiller-main.yml

          mapfile -t staged < <(git diff --cached --name-only | sort)
          expected=(
            '.github/workflows/initialize-reasoning-distiller-main.yml'
            'project-knowledge/project.json'
          )
          test "${staged[*]}" = "${expected[*]}" || {
            printf 'Unexpected staged paths:\n%s\n' "${staged[*]}"
            exit 1
          }

          git commit -m 'chore: initialize Reasoning Distiller project state'
          git push origin HEAD:main
