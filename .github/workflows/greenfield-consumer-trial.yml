name: Reasoning Distiller Greenfield Consumer Trial

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/greenfield-consumer-trial.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  RELEASE_VERSION: '0.3.0'
  RELEASE_TAG: 'v0.3.0'
  RELEASE_SOURCE_SHA: '146f828efd258c5d964414f0118a64f2f77ed300'
  EXPECTED_CONTENT_IDENTITY: 'sha256:f5effb355ad8021e07b1053a125b44f13114579601496ed6014fc600f8e32db8'
  EXPECTED_TRANSPORT_SHA256: '2cac56f03b692b5443813c61be7ca37c0ea6ee1fd2649ac0b93f9ffe919cca0e'

jobs:
  greenfield:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Create true greenfield repository
        run: |
          set -euo pipefail
          mkdir -p /tmp/greenfield
          cd /tmp/greenfield
          git init -q
          git config user.email greenfield@example.invalid
          git config user.name 'Greenfield Trial'
          printf '%s\n' '# Greenfield Reasoning Distiller Trial' > README.md
          printf '%s\n' '.DS_Store' > .gitignore
          git add README.md .gitignore
          git commit -q -m 'initial empty project'
          test ! -e .reasoning-distiller
          test ! -e project-knowledge
          git rev-parse HEAD > /tmp/greenfield-initial-sha
          find . -maxdepth 2 -type f -not -path './.git/*' -print | sort > /tmp/initial-tree.txt

      - name: Retrieve exact accepted release read-only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/rd-release
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir /tmp/rd-release
          cd /tmp/rd-release
          test -f "reasoning-distiller-${RELEASE_VERSION}.tar.gz"
          test -f "reasoning-distiller-${RELEASE_VERSION}.manifest.json"
          test -f "reasoning-distiller-${RELEASE_VERSION}.sha256"
          test -f rd_install.py
          test -f validate_install_package_contract.py
          test -f install-package-manifest.schema.json
          test -f installation-record.schema.json
          test "$(sha256sum "reasoning-distiller-${RELEASE_VERSION}.tar.gz" | awk '{print $1}')" = "$EXPECTED_TRANSPORT_SHA256"
          test "$(awk '{print $1}' "reasoning-distiller-${RELEASE_VERSION}.sha256")" = "$EXPECTED_TRANSPORT_SHA256"

      - name: Arrange only release installer bootstrap assets
        run: |
          set -euo pipefail
          mkdir -p /tmp/rd-bootstrap/packaging /tmp/rd-bootstrap/schemas
          cp /tmp/rd-release/rd_install.py /tmp/rd-bootstrap/packaging/
          cp /tmp/rd-release/validate_install_package_contract.py /tmp/rd-bootstrap/packaging/
          cp /tmp/rd-release/install-package-manifest.schema.json /tmp/rd-bootstrap/schemas/
          cp /tmp/rd-release/installation-record.schema.json /tmp/rd-bootstrap/schemas/
          python -m pip install --disable-pip-version-check jsonschema==4.25.1

      - name: Install accepted release into greenfield repository
        run: |
          set -euo pipefail
          python /tmp/rd-bootstrap/packaging/rd_install.py \
            --package "/tmp/rd-release/reasoning-distiller-${RELEASE_VERSION}.tar.gz" \
            --manifest "/tmp/rd-release/reasoning-distiller-${RELEASE_VERSION}.manifest.json" \
            --transport-sha256 "$EXPECTED_TRANSPORT_SHA256" \
            --target /tmp/greenfield \
            --source-repository loteque/reasoning-distiller \
            --source-locator "$RELEASE_TAG" \
            --runner-id "greenfield-${GITHUB_RUN_ID}" \
            > /tmp/install-result.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          r=json.loads(Path('/tmp/install-result.json').read_text())
          assert r['status']=='PASS'
          assert r['version']==os.environ['RELEASE_VERSION']
          assert r['content_identity']==os.environ['EXPECTED_CONTENT_IDENTITY']
          i=json.loads(Path('/tmp/greenfield/.reasoning-distiller/.installation/INSTALLATION.json').read_text())
          assert i['source_commit']==os.environ['RELEASE_SOURCE_SHA']
          assert i['transport_sha256']==os.environ['EXPECTED_TRANSPORT_SHA256']
          assert Path('/tmp/greenfield/.reasoning-distiller/runtime/rd_bootstrap.py').is_file()
          PY

      - name: Bootstrap project-owned state using installed runtime only
        run: |
          set -euo pipefail
          python /tmp/greenfield/.reasoning-distiller/runtime/rd_bootstrap.py --target /tmp/greenfield > /tmp/bootstrap-result.json
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('/tmp/bootstrap-result.json').read_text())
          assert r['status']=='PASS'
          assert r['outcome']=='CREATED'
          assert r['project_contract']=='reasoning-distiller-project/1'
          root=Path('/tmp/greenfield/project-knowledge')
          assert (root/'project.json').is_file()
          assert (root/'evidence').is_dir()
          assert (root/'invocations').is_dir()
          assert (root/'submissions').is_dir()
          assert not (root/'PEMS').exists()
          assert not (root/'COVE').exists()
          PY

      - name: Verify bootstrap idempotence
        run: |
          set -euo pipefail
          python /tmp/greenfield/.reasoning-distiller/runtime/rd_bootstrap.py --target /tmp/greenfield > /tmp/bootstrap-result-second.json
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('/tmp/bootstrap-result-second.json').read_text())
          assert r['status']=='PASS'
          assert r['outcome']=='ALREADY_BOOTSTRAPPED'
          PY

      - name: Verify ownership and authority boundary
        run: |
          set -euo pipefail
          cd /tmp/greenfield
          test ! -e .rd-install-transaction.json
          test ! -e .rd-install-backup
          test ! -e project-knowledge/PEMS
          test ! -e project-knowledge/COVE
          find . -maxdepth 4 -type f -not -path './.git/*' -print | sort > /tmp/final-tree.txt
          git status --porcelain > /tmp/final-status.txt

      - name: Emit measured trial disposition
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          result={
            'contract':'reasoning-distiller-greenfield-consumer-trial-result/1',
            'status':'PASS',
            'pass':True,
            'release_version':os.environ['RELEASE_VERSION'],
            'release_tag':os.environ['RELEASE_TAG'],
            'release_source_commit':os.environ['RELEASE_SOURCE_SHA'],
            'content_identity':os.environ['EXPECTED_CONTENT_IDENTITY'],
            'transport_sha256':os.environ['EXPECTED_TRANSPORT_SHA256'],
            'installation':'PASS',
            'bootstrap':'PASS',
            'bootstrap_idempotence':'PASS',
            'authority_boundary':'PASS',
            'finding_disposition':{'GFCT-001':'CLOSED_BY_ACCEPTED_RELEASE_RETEST'},
            'invocation_attempted':False,
            'next_boundary':'explicit evidence and first invocation construction'
          }
          Path('/tmp/trial-result.json').write_text(json.dumps(result,indent=2,sort_keys=True)+'\n')
          PY

      - name: Upload durable run evidence
        uses: actions/upload-artifact@v4
        with:
          name: greenfield-consumer-trial-${{ github.run_id }}
          include-hidden-files: true
          path: |
            /tmp/greenfield-initial-sha
            /tmp/initial-tree.txt
            /tmp/final-tree.txt
            /tmp/final-status.txt
            /tmp/install-result.json
            /tmp/bootstrap-result.json
            /tmp/bootstrap-result-second.json
            /tmp/trial-result.json
            /tmp/greenfield/project-knowledge/project.json
            /tmp/greenfield/.reasoning-distiller/.installation/INSTALLATION.json
            /tmp/greenfield/.reasoning-distiller/.installation/MANIFEST.json
