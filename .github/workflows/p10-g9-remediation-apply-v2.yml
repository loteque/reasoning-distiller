name: P10 G9 remediation patch applicator v2

on:
  push:
    branches:
      - impl/p10-g9-remediation-20260825

permissions:
  contents: write

jobs:
  apply-remediation:
    if: github.event.head_commit.message == 'stage-p10-g9-remediation-v2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: impl/p10-g9-remediation-20260825
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.0'
      - name: Apply bounded semantic remediation
        run: python tools/p10_g9_apply_remediation.py
      - name: Verify targeted remediation on exact runtime
        run: |
          python -m pip install --disable-pip-version-check pytest jsonschema==4.25.1 referencing PyYAML==6.0.2
          python -m pytest -q \
            tests/test_context_packaging_production_integration_p10_g4.py \
            tests/test_context_packaging_production_integration_p10_g9_remediation.py
      - name: Commit bounded semantic remediation
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name 'loteque'
          git config user.email '69282314+loteque@users.noreply.github.com'
          git add context_packaging/prepare_integration.py \
                  tests/test_context_packaging_production_integration_p10_g4.py \
                  tests/test_context_packaging_production_integration_p10_g9_remediation.py
          git commit -m 'fix(p10): bind eligibility consumer for PI-09'
          git push origin HEAD:impl/p10-g9-remediation-20260825
