name: Project Bootstrap

on:
  push:
    branches: [main]
    paths:
      - 'runtime/rd_bootstrap.py'
      - 'tests/test_rd_bootstrap.py'
      - 'docs/operations/PROJECT_BOOTSTRAP_CONTRACT.md'
      - '.github/workflows/project-bootstrap.yml'
  pull_request:
    paths:
      - 'runtime/rd_bootstrap.py'
      - 'tests/test_rd_bootstrap.py'
      - 'docs/operations/PROJECT_BOOTSTRAP_CONTRACT.md'
      - '.github/workflows/project-bootstrap.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run bootstrap conformance suite
        run: python -m unittest -v tests/test_rd_bootstrap.py
