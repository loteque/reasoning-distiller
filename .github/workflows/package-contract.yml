name: Reasoning Distiller Package Contract

on:
  push:
    branches: [main]
    paths:
      - 'docs/packaging/**'
      - 'schemas/install-package-manifest.schema.json'
      - 'schemas/installation-record.schema.json'
      - 'packaging/**'
      - 'tests/test_install_package_contract.py'
      - '.github/workflows/package-contract.yml'
  pull_request:
    paths:
      - 'docs/packaging/**'
      - 'schemas/install-package-manifest.schema.json'
      - 'schemas/installation-record.schema.json'
      - 'packaging/**'
      - 'tests/test_install_package_contract.py'
      - '.github/workflows/package-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install schema validator
        run: python -m pip install --disable-pip-version-check jsonschema==4.25.1
      - name: Validate examples
        run: |
          python packaging/validate_install_package_contract.py \
            --manifest packaging/examples/manifest.example.json \
            --installation packaging/examples/installation.example.json
      - name: Run P1 contract tests
        run: python -m unittest -v tests/test_install_package_contract.py
