name: P10 G8 ec410a50 Engineer evidence

on:
  push:
    branches:
      - evidence/p10-g8-ec410a50-engineer-20260825
  pull_request:
    branches:
      - impl/p10-g7-migration-rollback-20260825

permissions:
  contents: read

env:
  P10_G8_CANDIDATE: ec410a501e7db051f59eb2fb373c30da150bd81a
  P10_G8_PACKAGE_VERSION: 0.0.0-p10-g8

jobs:
  g8-full-candidate-package-runtime:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact G7 semantic candidate
        uses: actions/checkout@v4
        with:
          ref: ec410a501e7db051f59eb2fb373c30da150bd81a
          fetch-depth: 0

      - name: Set up exact certified runtime
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.0"

      - name: Install bounded test dependencies
        run: python -m pip install --disable-pip-version-check pytest jsonschema==4.25.1 referencing PyYAML==6.0.2

      - name: Verify immutable candidate and exact runtime
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$P10_G8_CANDIDATE"
          test "$(git status --porcelain)" = ""
          python - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import platform
          import sys

          assert platform.python_implementation() == "CPython"
          assert sys.implementation.name == "cpython"
          assert sys.version_info[:3] == (3, 12, 0), sys.version
          assert sys.implementation.cache_tag == "cpython-312", sys.implementation.cache_tag
          executable = pathlib.Path(sys.executable).resolve()
          runtime_sha256 = hashlib.sha256(executable.read_bytes()).hexdigest()
          record = {
              "implementation": sys.implementation.name,
              "version": ".".join(map(str, sys.version_info[:3])),
              "cache_tag": sys.implementation.cache_tag,
              "executable": str(executable),
              "executable_sha256": runtime_sha256,
              "runner_os": os.environ.get("RUNNER_OS"),
              "runner_arch": os.environ.get("RUNNER_ARCH"),
              "image_os": os.environ.get("ImageOS"),
              "image_version": os.environ.get("ImageVersion"),
          }
          pathlib.Path("/tmp/p10-g8-runtime.json").write_text(json.dumps(record, sort_keys=True) + "\n")
          print(json.dumps(record, sort_keys=True))
          PY
          git rev-parse HEAD^{tree} | tee /tmp/p10-g8-candidate-tree.txt
          python -m pip freeze | sort | tee /tmp/p10-g8-dependencies.txt

      - name: Build and bind one deterministic candidate package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/p10-g8-package
          mkdir -p /tmp/p10-g8-package
          python packaging/build_release_package.py \
            --version "$P10_G8_PACKAGE_VERSION" \
            --source-commit "$P10_G8_CANDIDATE" \
            --output-dir /tmp/p10-g8-package \
            | tee /tmp/p10-g8-build.json
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          candidate = "ec410a501e7db051f59eb2fb373c30da150bd81a"
          version = "0.0.0-p10-g8"
          build = json.loads(Path("/tmp/p10-g8-build.json").read_text())
          manifest_path = Path(build["manifest"])
          archive_path = Path(build["archive"])
          manifest = json.loads(manifest_path.read_text())
          assert manifest["source_commit"] == candidate
          assert manifest["version"] == version
          archive_sha256 = hashlib.sha256(archive_path.read_bytes()).hexdigest()
          manifest_sha256 = hashlib.sha256(manifest_path.read_bytes()).hexdigest()
          assert archive_sha256 == manifest["transport_sha256"] == build["transport_sha256"]
          assert build["content_identity"] == manifest["content_identity"]
          record = {
              "candidate": candidate,
              "version": version,
              "content_identity": manifest["content_identity"],
              "transport_sha256": archive_sha256,
              "manifest_sha256": manifest_sha256,
              "file_count": len(manifest["files"]),
              "managed_roots": manifest["managed_roots"],
              "archive": str(archive_path),
              "manifest": str(manifest_path),
          }
          Path("/tmp/p10-g8-package.json").write_text(json.dumps(record, sort_keys=True) + "\n")
          print(json.dumps(record, sort_keys=True))
          PY

      - name: Rehydrate behavior-bearing roots from that exact package
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import shutil
          from pathlib import Path

          package = json.loads(Path("/tmp/p10-g8-package.json").read_text())
          for root in package["managed_roots"]:
              path = Path(root)
              if path.exists():
                  shutil.rmtree(path)
          PY
          tar -xzf /tmp/p10-g8-package/reasoning-distiller-${P10_G8_PACKAGE_VERSION}.tar.gz -C .
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          manifest = json.loads(Path("/tmp/p10-g8-package/reasoning-distiller-0.0.0-p10-g8.manifest.json").read_text())
          expected = {item["path"]: item["sha256"] for item in manifest["files"]}
          actual = {}
          for root in manifest["managed_roots"]:
              for path in Path(root).rglob("*"):
                  if path.is_file() and "__pycache__" not in path.parts and path.suffix not in {".pyc", ".pyo"}:
                      actual[path.as_posix()] = hashlib.sha256(path.read_bytes()).hexdigest()
          assert set(actual) == set(expected), (sorted(set(expected) - set(actual)), sorted(set(actual) - set(expected)))
          assert actual == expected
          print(f"P10_G8_EXACT_PACKAGE_REHYDRATION_PASS files={len(actual)}")
          PY

      - name: Retrieve exact historical v0.5.3 release assets for G7
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/p10-g8-v053
          curl -L --fail --retry 3 \
            https://github.com/loteque/reasoning-distiller/releases/download/v0.5.3/reasoning-distiller-0.5.3.manifest.json \
            -o /tmp/p10-g8-v053/reasoning-distiller-0.5.3.manifest.json
          curl -L --fail --retry 3 \
            https://github.com/loteque/reasoning-distiller/releases/download/v0.5.3/reasoning-distiller-0.5.3.tar.gz \
            -o /tmp/p10-g8-v053/reasoning-distiller-0.5.3.tar.gz
          echo '5c9448c6e6acc6f3925aae173870f4d6e8a237035c0e870637ef8d7499765044  /tmp/p10-g8-v053/reasoning-distiller-0.5.3.manifest.json' | sha256sum -c -
          echo '5d1751f1910e13ba5b3e9787a6188a1b995e0ac5b88bbec9c2ac935e9d33ef67  /tmp/p10-g8-v053/reasoning-distiller-0.5.3.tar.gz' | sha256sum -c -

      - name: Run complete P10 G0-G7 suite on exact tuple
        shell: bash
        env:
          P10_G7_V053_MANIFEST: /tmp/p10-g8-v053/reasoning-distiller-0.5.3.manifest.json
          P10_G7_V053_ARCHIVE: /tmp/p10-g8-v053/reasoning-distiller-0.5.3.tar.gz
        run: |
          set +e
          python -m pytest -q \
            tests/test_context_packaging_production_integration_p10_g0.py \
            tests/test_context_packaging_production_integration_p10_g1.py \
            tests/test_context_packaging_production_integration_p10_g2.py \
            tests/test_context_packaging_production_integration_p10_g3.py \
            tests/test_context_packaging_production_integration_p10_g4.py \
            tests/test_context_packaging_production_integration_p10_g5.py \
            tests/test_context_packaging_production_integration_p10_g6.py \
            tests/test_context_packaging_production_integration_p10_g7.py \
            2>&1 | tee /tmp/p10-g8-p10-suite.txt
          status=${PIPESTATUS[0]}
          set -e
          echo "P10_G8_P10_STATUS=$status" >> "$GITHUB_ENV"

      - name: Run unaffected fixed production invocation contract 1 regressions
        shell: bash
        run: |
          set +e
          python -m pytest -q tests/test_production_invocation.py \
            2>&1 | tee /tmp/p10-g8-production-v1.txt
          status=${PIPESTATUS[0]}
          set -e
          echo "P10_G8_PRODUCTION_V1_STATUS=$status" >> "$GITHUB_ENV"

      - name: Run unaffected P0-P9 context-packaging regressions
        shell: bash
        run: |
          set +e
          mapfile -t regressions < <(
            find tests -maxdepth 1 -type f -name 'test_context_packaging_*.py' -print \
              | sort \
              | grep -v -E 'test_context_packaging_production_integration_p10_g[0-9]+\.py$'
          )
          printf '%s\n' "${regressions[@]}" | tee /tmp/p10-g8-p0-p9-inventory.txt
          python -m pytest -q "${regressions[@]}" \
            -k 'not test_p5_runtime_implementation_is_unchanged_by_amendment and not test_negative_fixtures_reject_and_classify_exactly' \
            2>&1 | tee /tmp/p10-g8-p0-p9.txt
          status=${PIPESTATUS[0]}
          set -e
          echo "P10_G8_P0_P9_STATUS=$status" >> "$GITHUB_ENV"

      - name: Run canonical package and installer regressions
        shell: bash
        run: |
          set +e
          python -m pytest -q \
            tests/test_package_builder.py \
            tests/test_install_package_contract.py \
            tests/test_installer_p3.py \
            tests/test_installer_p4.py \
            2>&1 | tee /tmp/p10-g8-package-installer.txt
          status=${PIPESTATUS[0]}
          set -e
          echo "P10_G8_PACKAGE_INSTALLER_STATUS=$status" >> "$GITHUB_ENV"

      - name: Reproduce inherited PS-19 classifier mismatch separately
        shell: bash
        run: |
          set +e
          python -m pytest -q tests/test_context_packaging_protocol_schemas_p1b.py::P1b::test_negative_fixtures_reject_and_classify_exactly \
            2>&1 | tee /tmp/p10-g8-inherited-ps19.txt
          status=${PIPESTATUS[0]}
          set -e
          test "$status" -eq 1
          grep -F 'PS-19' /tmp/p10-g8-inherited-ps19.txt
          grep -F 'PLANE_CLASSIFICATION_CONFLICT' /tmp/p10-g8-inherited-ps19.txt
          grep -F 'UNKNOWN_SEMANTICS_FIELD' /tmp/p10-g8-inherited-ps19.txt
          echo 'P10_G8_INHERITED_PS19_REPRODUCED'

      - name: Write exact G8 tuple and result summary
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          def load(path):
              p = Path(path)
              return json.loads(p.read_text()) if p.exists() else None

          summary = {
              "contract": "reasoning-distiller-p10-g8-engineer-evidence/1",
              "candidate": os.environ.get("P10_G8_CANDIDATE"),
              "candidate_tree": Path("/tmp/p10-g8-candidate-tree.txt").read_text().strip() if Path("/tmp/p10-g8-candidate-tree.txt").exists() else None,
              "package": load("/tmp/p10-g8-package.json"),
              "runtime": load("/tmp/p10-g8-runtime.json"),
              "statuses": {
                  "p10_g0_g7": os.environ.get("P10_G8_P10_STATUS"),
                  "production_v1": os.environ.get("P10_G8_PRODUCTION_V1_STATUS"),
                  "p0_p9": os.environ.get("P10_G8_P0_P9_STATUS"),
                  "package_installer": os.environ.get("P10_G8_PACKAGE_INSTALLER_STATUS"),
              },
              "workflow_run_id": os.environ.get("GITHUB_RUN_ID"),
              "workflow_run_attempt": os.environ.get("GITHUB_RUN_ATTEMPT"),
          }
          Path("/tmp/p10-g8-summary.json").write_text(json.dumps(summary, indent=2, sort_keys=True) + "\n")
          print(Path("/tmp/p10-g8-summary.json").read_text())
          PY

      - name: Upload candidate-bound G8 evidence bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p10-g8-ec410a50-evidence
          if-no-files-found: error
          path: |
            /tmp/p10-g8-summary.json
            /tmp/p10-g8-runtime.json
            /tmp/p10-g8-dependencies.txt
            /tmp/p10-g8-candidate-tree.txt
            /tmp/p10-g8-build.json
            /tmp/p10-g8-package.json
            /tmp/p10-g8-package/reasoning-distiller-0.0.0-p10-g8.tar.gz
            /tmp/p10-g8-package/reasoning-distiller-0.0.0-p10-g8.manifest.json
            /tmp/p10-g8-package/reasoning-distiller-0.0.0-p10-g8.sha256
            /tmp/p10-g8-p10-suite.txt
            /tmp/p10-g8-production-v1.txt
            /tmp/p10-g8-p0-p9-inventory.txt
            /tmp/p10-g8-p0-p9.txt
            /tmp/p10-g8-package-installer.txt
            /tmp/p10-g8-inherited-ps19.txt

      - name: Enforce complete G8 gate
        shell: bash
        run: |
          set -euo pipefail
          test "$P10_G8_P10_STATUS" -eq 0
          test "$P10_G8_PRODUCTION_V1_STATUS" -eq 0
          test "$P10_G8_P0_P9_STATUS" -eq 0
          test "$P10_G8_PACKAGE_INSTALLER_STATUS" -eq 0
          echo 'P10_G8_FULL_REGRESSION_ENGINEER_EXECUTION_PASS'
