name: Execute activated V2R1 reconciliation

on:
  push:
    branches: [ril/reconcile-first-normative-v2r1]

permissions:
  contents: write

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run exact activated reconciliation primitive
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import sys
          from pathlib import Path

          root = Path('.').resolve()
          sys.path.insert(0, str(root / '.reasoning-distiller' / 'runtime'))
          from ril_activation import make_explicit_activation, validate_activation
          from ril_reconciliation import reconcile_candidate

          candidate = Path('project-knowledge/submissions/first-normative-baseline-v2r1-20260820.json')
          submission = json.loads(candidate.read_text())
          assert submission['submission_id'] == 'RGP-5F3E7F7DDB028217FB7D9DA79E650DE4'

          activation = make_explicit_activation(
              'steward:default',
              'reconcile-first-normative-v2r1-20260820-1634-pdt',
              'Activate steward:default for semantic_reconciliation of RGP-5F3E7F7DDB028217FB7D9DA79E650DE4',
          )
          activation_result = validate_activation(root, 'semantic_reconciliation', activation)
          print(json.dumps({'activation': activation, 'validation': activation_result}, sort_keys=True))
          assert activation_result['status'] == 'PASS', activation_result
          assert activation_result['outcome'] == 'ACTIVATION_ACCEPTED', activation_result

          assessment = {
              'contract': 'reasoning-distiller-reconciliation-assessment/1',
              'semantic_status': 'COMPATIBLE',
              'admission_recommendation': 'RECOMMEND',
              'rationale': (
                  'V2R1 is a reviewed, validator-passed candidate whose eight bound evidence files remain byte-identical '
                  'to the invocation evidence. Current project-knowledge contains no admitted canonical PEMS/CoVe state, '
                  'so no canonical conflict is present. The candidate remains semantically compatible with the project '
                  'and is recommended for admission.'
              ),
          }
          result = reconcile_candidate(root, candidate, activation, assessment)
          print(json.dumps(result, sort_keys=True))
          assert result['status'] == 'PASS', result
          assert result['outcome'] == 'RECONCILED', result
          assert result['semantic_status'] == 'COMPATIBLE', result
          assert result['admission_recommendation'] == 'RECOMMEND', result
          PY
      - name: Restrict mutation to reconciliation artifacts
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git status --porcelain=v1 --untracked-files=all | awk '{print $2}')"
          test -n "$changed"
          while IFS= read -r path; do
            test -z "$path" && continue
            case "$path" in
              project-knowledge/reconciliation/*) ;;
              *) echo "Unexpected mutation: $path" >&2; exit 1 ;;
            esac
          done <<< "$changed"
      - name: Commit reconciliation evidence and disposition
        shell: bash
        run: |
          set -euo pipefail
          git add project-knowledge/reconciliation
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'project-knowledge: reconcile reviewed V2R1 candidate'
          git push origin HEAD:ril/reconcile-first-normative-v2r1
