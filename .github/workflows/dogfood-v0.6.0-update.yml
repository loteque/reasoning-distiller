name: Dogfood Reasoning Distiller v0.6.0 Update

on:
  push:
    branches:
      - 'dogfood/rupi-v0.6.0-update'
    paths:
      - '.github/workflows/dogfood-v0.6.0-update.yml'

permissions:
  contents: write

jobs:
  update-installation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dogfood/rupi-v0.6.0-update
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify starting installation and accepted release
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          current=json.loads(Path('.reasoning-distiller/.installation/INSTALLATION.json').read_text())
          assert current['version']=='0.5.3', current
          assert current['content_identity']=='sha256:a78ab1f561e5679df810eb5f838644958118808d3fbb6f52ee969d2da63ff48a'
          status=json.loads(Path('docs/packaging/CURRENT_RELEASE_STATUS.json').read_text())
          assert status['status']=='PASS', status
          assert status['release_version']=='0.6.0', status
          assert status['release_tag']=='v0.6.0', status
          assert status['source_commit']=='79f253d2053b03223da524f6f50c218728018248', status
          assert status['content_identity']=='sha256:38a4742c67e869f7bd33feba9b4ea4ff6f7558e1bbd13a24336e45145e7d8478', status
          assert status['transport_sha256']=='4fa53c1c4afb3ba07eb365158b4ec5e2a8090284aa485d07b0e35abcfa323cde', status
          print('PASS starting installation and accepted release bound')
          PY

      - name: Retrieve exact v0.6.0 release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/rd-v0.6.0
          gh release download v0.6.0 --repo "$GITHUB_REPOSITORY" --dir /tmp/rd-v0.6.0 \
            --pattern 'reasoning-distiller-0.6.0.tar.gz' \
            --pattern 'reasoning-distiller-0.6.0.manifest.json' \
            --pattern 'reasoning-distiller-0.6.0.sha256' \
            --pattern 'rd_install.py' \
            --pattern 'validate_install_package_contract.py'
          test "$(sha256sum /tmp/rd-v0.6.0/reasoning-distiller-0.6.0.tar.gz | awk '{print $1}')" = '4fa53c1c4afb3ba07eb365158b4ec5e2a8090284aa485d07b0e35abcfa323cde'

      - name: Install accepted v0.6.0 into managed tree
        shell: bash
        run: |
          set -euo pipefail
          installed_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          python /tmp/rd-v0.6.0/rd_install.py \
            --package /tmp/rd-v0.6.0/reasoning-distiller-0.6.0.tar.gz \
            --manifest /tmp/rd-v0.6.0/reasoning-distiller-0.6.0.manifest.json \
            --transport-sha256 4fa53c1c4afb3ba07eb365158b4ec5e2a8090284aa485d07b0e35abcfa323cde \
            --target "$GITHUB_WORKSPACE" \
            --installed-at "$installed_at" \
            --runner-id "github-actions:${GITHUB_RUN_ID}" \
            --source-repository loteque/reasoning-distiller \
            --source-locator v0.6.0 \
            --update-locator "github-actions-run:${GITHUB_RUN_ID}"

      - name: Verify exact installed identity and mutation boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          record=json.loads(Path('.reasoning-distiller/.installation/INSTALLATION.json').read_text())
          manifest=json.loads(Path('.reasoning-distiller/.installation/MANIFEST.json').read_text())
          expected={
            'version':'0.6.0',
            'source_commit':'79f253d2053b03223da524f6f50c218728018248',
            'content_identity':'sha256:38a4742c67e869f7bd33feba9b4ea4ff6f7558e1bbd13a24336e45145e7d8478',
            'transport_sha256':'4fa53c1c4afb3ba07eb365158b4ec5e2a8090284aa485d07b0e35abcfa323cde',
          }
          for key,value in expected.items():
              assert record[key]==value, (key,record.get(key),value)
          assert record['source_repository']=='loteque/reasoning-distiller'
          assert record['source_locator']=='v0.6.0'
          assert record['runner']['invocation_id']==f"github-actions:{__import__('os').environ['GITHUB_RUN_ID']}"
          assert record['update_locator']==f"github-actions-run:{__import__('os').environ['GITHUB_RUN_ID']}"
          assert manifest['version']=='0.6.0'
          assert manifest['source_commit']==expected['source_commit']
          assert manifest['content_identity']==expected['content_identity']
          assert manifest['transport_sha256']==expected['transport_sha256']
          assert len(manifest['files'])==99
          print('PASS exact v0.6.0 installation identity')
          PY
          nonmanaged="$(git status --porcelain=v1 --untracked-files=all | grep -vE '^.. \.reasoning-distiller(/|$)' || true)"
          test -z "$nonmanaged" || { printf '%s\n' "$nonmanaged" >&2; echo 'non-managed mutation detected' >&2; exit 1; }
          test ! -e .rd-install-transaction.json
          test ! -e .rd-install-backup
          echo 'PASS installer-owned mutation boundary'

      - name: Commit managed installation update
        shell: bash
        run: |
          set -euo pipefail
          git add -A .reasoning-distiller
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'dogfood: install Reasoning Distiller v0.6.0'
          git push origin HEAD:dogfood/rupi-v0.6.0-update
