name: Prepare Rupi admission Steward on main

on:
  push:
    branches:
      - rupi/prepare-admission-steward
    paths:
      - '.github/workflows/rupi-prepare-admission-steward.yml'

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact main baseline
        uses: actions/checkout@v4
        with:
          ref: c9b94933261bf3a4495668760db663635b0e8aa3
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Prepare protected admission Steward proposal
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import sys
          from pathlib import Path

          root = Path('.').resolve()
          runtime = root / '.reasoning-distiller' / 'runtime'
          sys.path.insert(0, str(runtime))

          import rupi_authority

          result = rupi_authority.prepare_steward_authorization(
              root,
              scope='admission',
              role_id='steward:default',
              requested_goal='authorize the default Steward for admission on main',
          )
          print(json.dumps(result, indent=2, sort_keys=True))
          assert result['status'] == 'STOPPED', result
          assert result['outcome'] == 'STEWARD_CONFIRMATION_REQUIRED', result
          assert result['scope'] == 'admission', result
          assert result['role_id'] == 'steward:default', result
          assert result['required_confirmation'] == 'STEWARD_AUTHORIZATION_CHANGE', result
          assert result['proposal_reference'], result
          status = result['checkpoint']['status']
          assert status['dimensions']['operator'] == 'VALID', status
          assert status['dimensions']['reconciliation_authority'] == 'AVAILABLE', status
          assert status['dimensions']['admission_authority'] == 'UNASSIGNED', status
          PY

      - name: Prove proposal preparation was read-only
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          test -z "$(git status --porcelain=v1)"
