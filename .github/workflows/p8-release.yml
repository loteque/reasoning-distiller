name: Reasoning Distiller Release Acceptance

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/p8-release.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: reasoning-distiller-release-acceptance
  cancel-in-progress: false

env:
  RELEASE_VERSION: '0.6.0'
  RELEASE_TAG: 'v0.6.0'
  SOURCE_SHA: '79f253d2053b03223da524f6f50c218728018248'

jobs:
  accept-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout evidence branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Capture exact evidence base
        id: base
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Checkout exact release source
        uses: actions/checkout@v4
        with:
          repository: loteque/reasoning-distiller
          ref: ${{ env.SOURCE_SHA }}
          path: release-source
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install package-contract dependency
        run: python -m pip install --disable-pip-version-check jsonschema==4.25.1

      - name: Rebuild twice from exact source
        shell: bash
        run: |
          set -euo pipefail
          (
            cd release-source
            python packaging/build_release_package.py --version "$RELEASE_VERSION" --source-commit "$SOURCE_SHA" --output-dir /tmp/rd-release-a
            python packaging/build_release_package.py --version "$RELEASE_VERSION" --source-commit "$SOURCE_SHA" --output-dir /tmp/rd-release-b
            python packaging/validate_install_package_contract.py --manifest "/tmp/rd-release-a/reasoning-distiller-${RELEASE_VERSION}.manifest.json"
          )
          cmp "/tmp/rd-release-a/reasoning-distiller-${RELEASE_VERSION}.tar.gz" "/tmp/rd-release-b/reasoning-distiller-${RELEASE_VERSION}.tar.gz"
          cmp "/tmp/rd-release-a/reasoning-distiller-${RELEASE_VERSION}.manifest.json" "/tmp/rd-release-b/reasoning-distiller-${RELEASE_VERSION}.manifest.json"
          cmp "/tmp/rd-release-a/reasoning-distiller-${RELEASE_VERSION}.sha256" "/tmp/rd-release-b/reasoning-distiller-${RELEASE_VERSION}.sha256"

      - name: Verify production invocation and bootstrap payload
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          version=os.environ['RELEASE_VERSION']
          manifest=json.loads(Path(f'/tmp/rd-release-a/reasoning-distiller-{version}.manifest.json').read_text(encoding='utf-8'))
          paths={item['path'] for item in manifest['files']}
          required={
            'runtime/rd_distill.py',
            'runtime/rd_bootstrap.py',
            'schemas/invocation-request.schema.json',
            'schemas/invocation-result.schema.json',
            'agents/distiller/DIRECTIVE.md',
            'validators/rgp_validator.py'
          }
          missing=sorted(required-paths)
          assert not missing, f'missing required production payload: {missing}'
          assert manifest['version']==version
          assert manifest['source_commit']==os.environ['SOURCE_SHA']
          print('PASS production invocation and bootstrap payload present')
          print('CONTENT_IDENTITY='+manifest['content_identity'])
          print('TRANSPORT_SHA256='+manifest['transport_sha256'])
          PY

      - name: Copy installer bootstrap assets
        shell: bash
        run: |
          set -euo pipefail
          cp release-source/packaging/rd_install.py /tmp/rd-release-a/rd_install.py
          cp release-source/packaging/validate_install_package_contract.py /tmp/rd-release-a/validate_install_package_contract.py
          cp release-source/schemas/install-package-manifest.schema.json /tmp/rd-release-a/install-package-manifest.schema.json
          cp release-source/schemas/installation-record.schema.json /tmp/rd-release-a/installation-record.schema.json

      - name: Publish or verify immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          archive="/tmp/rd-release-a/reasoning-distiller-${RELEASE_VERSION}.tar.gz"
          manifest="/tmp/rd-release-a/reasoning-distiller-${RELEASE_VERSION}.manifest.json"
          detached="/tmp/rd-release-a/reasoning-distiller-${RELEASE_VERSION}.sha256"
          content_identity="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["content_identity"])' "$manifest")"
          transport_sha="$(awk '{print $1}' "$detached")"
          assets=(
            "$archive"
            "$manifest"
            "$detached"
            "/tmp/rd-release-a/rd_install.py"
            "/tmp/rd-release-a/validate_install_package_contract.py"
            "/tmp/rd-release-a/install-package-manifest.schema.json"
            "/tmp/rd-release-a/installation-record.schema.json"
          )

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            tag_sha="$(git ls-remote --tags origin "refs/tags/$RELEASE_TAG" | awk '{print $1}')"
            test "$tag_sha" = "$SOURCE_SHA" || { echo "release tag points to $tag_sha, expected $SOURCE_SHA" >&2; exit 1; }
            gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | sort > /tmp/actual-assets.txt
            printf '%s\n' \
              "install-package-manifest.schema.json" \
              "installation-record.schema.json" \
              "rd_install.py" \
              "reasoning-distiller-${RELEASE_VERSION}.manifest.json" \
              "reasoning-distiller-${RELEASE_VERSION}.sha256" \
              "reasoning-distiller-${RELEASE_VERSION}.tar.gz" \
              "validate_install_package_contract.py" | sort > /tmp/expected-assets.txt
            diff -u /tmp/expected-assets.txt /tmp/actual-assets.txt
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$SOURCE_SHA" \
              --title "Reasoning Distiller ${RELEASE_VERSION}" \
              --notes "Accepted deterministic package release containing the production rd-distill invocation runtime and deterministic project bootstrap primitive. Source: ${SOURCE_SHA}. Content identity: ${content_identity}. Transport SHA-256: ${transport_sha}."
            tag_sha="$(git ls-remote --tags origin "refs/tags/$RELEASE_TAG" | awk '{print $1}')"
            test "$tag_sha" = "$SOURCE_SHA" || { echo "created release tag points to $tag_sha, expected $SOURCE_SHA" >&2; exit 1; }
          fi

          echo "CONTENT_IDENTITY=$content_identity" >> "$GITHUB_ENV"
          echo "TRANSPORT_SHA256=$transport_sha" >> "$GITHUB_ENV"
          echo "PASS immutable release assets available"

      - name: Persist release PASS evidence
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          status={
            'contract':'reasoning-distiller-release-status/1',
            'status':'PASS',
            'release_version':os.environ['RELEASE_VERSION'],
            'release_tag':os.environ['RELEASE_TAG'],
            'source_commit':os.environ['SOURCE_SHA'],
            'content_identity':os.environ['CONTENT_IDENTITY'],
            'transport_sha256':os.environ['TRANSPORT_SHA256'],
            'contains_production_invocation':True,
            'contains_project_bootstrap':True,
            'invocation_contract':'reasoning-distiller-invocation/1',
            'invocation_result_contract':'reasoning-distiller-invocation-result/1',
            'bootstrap_contract':'reasoning-distiller-project-bootstrap/1',
            'bootstrap_result_contract':'reasoning-distiller-project-bootstrap-result/1',
            'project_contract':'reasoning-distiller-project/2',
            'release_assets':[
              f"reasoning-distiller-{os.environ['RELEASE_VERSION']}.tar.gz",
              f"reasoning-distiller-{os.environ['RELEASE_VERSION']}.manifest.json",
              f"reasoning-distiller-{os.environ['RELEASE_VERSION']}.sha256",
              'rd_install.py',
              'validate_install_package_contract.py',
              'install-package-manifest.schema.json',
              'installation-record.schema.json'
            ],
            'runtime_repository_dependency':False,
            'consumer_write_credential_required':False,
            'semantic_authority_changed':False,
            'workflow_run':os.environ['GITHUB_RUN_ID']
          }
          Path('docs/packaging/CURRENT_RELEASE_STATUS.json').write_text(json.dumps(status,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          PY
          git fetch origin main
          test "$(git rev-parse refs/remotes/origin/main)" = "$BASE_SHA" || { echo 'main moved before release evidence commit' >&2; exit 1; }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/packaging/CURRENT_RELEASE_STATUS.json
          git commit -m "release: record accepted Reasoning Distiller ${RELEASE_VERSION}"
          git push origin HEAD:main
