name: P10 packaged PEMS runtime-isolation remediation evidence

on:
  push:
    branches:
      - evidence/p10-pems-runtime-isolation-824c812e-20260826

permissions:
  contents: read

env:
  SEMANTIC_BASE: ae5d5c21de1f646b7b7c4450a1f9e8db6fcbcf0e
  REMEDIATION: 824c812ed6ffe79b6a9afe7bfc9c1f6eab656a27
  REMEDIATION_TREE: 799e59a6de6e8f8ffecd41c0b81df9ec6e60e3c4
  FROZEN_V1_SCHEMA_BLOB: 4b240a5698294ce1a217ad758b4031830740fc29
  PEMS_BLOB: cd7683d704e8aef2842a0c1b25b453fb1dbc8030
  PACKAGE_VERSION: 0.0.0-p10-pems-isolation-remediation

jobs:
  candidate-bound-remediation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 824c812ed6ffe79b6a9afe7bfc9c1f6eab656a27
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.0"

      - name: Bind exact remediation and frozen semantic identities
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pytest jsonschema==4.25.1 referencing PyYAML==6.0.2
          test "$(git rev-parse HEAD)" = "$REMEDIATION"
          test "$(git rev-parse HEAD^{tree})" = "$REMEDIATION_TREE"
          test "$(git rev-parse "$SEMANTIC_BASE^{tree}")" = "81178c5efdc8f1419a068c61a92c0571b28f69fc"
          test "$(git hash-object schemas/context-pack.schema.json)" = "$FROZEN_V1_SCHEMA_BLOB"
          test "$(git hash-object backends/pems-cove/pems-v2.schema.json)" = "$PEMS_BLOB"
          test "$(git status --porcelain)" = ""
          python - <<'PY' | tee /tmp/remediation-binding.json
          import hashlib, json, os
          from pathlib import Path
          registry = json.loads(Path('schemas/resources/context-packaging-v1-resource-registry.json').read_text())
          pems = Path('backends/pems-cove/pems-v2.schema.json').read_bytes()
          assert registry['contract'] == 'reasoning-distiller-context-schema-resource-registry/1'
          assert registry['scope'] == 'context-packaging-v1-frozen-local-alias'
          assert registry['source_schema']['git_blob'] == os.environ['FROZEN_V1_SCHEMA_BLOB']
          assert registry['resources'][0]['git_blob'] == os.environ['PEMS_BLOB']
          assert registry['resources'][0]['raw_sha256'] == 'sha256:' + hashlib.sha256(pems).hexdigest()
          assert registry['resources'][0]['network_resolution'] is False
          print(json.dumps({
              'semantic_base': os.environ['SEMANTIC_BASE'],
              'remediation': os.environ['REMEDIATION'],
              'remediation_tree': os.environ['REMEDIATION_TREE'],
              'frozen_v1_schema_blob': os.environ['FROZEN_V1_SCHEMA_BLOB'],
              'pems_blob': os.environ['PEMS_BLOB'],
              'registry_scope': registry['scope'],
          }, sort_keys=True))
          PY

      - name: Run focused semantic-preservation and fail-closed regression suite
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/test_p10_packaged_pems_runtime_isolation_remediation.py \
            tests/test_runtime_isolation_p5.py \
            tests/test_package_builder.py \
            tests/test_context_packaging_protocol_schemas_p1b.py \
            tests/test_context_packaging_protocol_schemas_v2.py \
            tests/test_context_packaging_production_integration_p10_g7.py::test_p10_g7_explicit_v2_selection_preserves_v1_and_contract_rollback \
            2>&1 | tee /tmp/remediation-pytest.txt
          echo P10_PACKAGED_PEMS_REMEDIATION_REGRESSION_PASS | tee -a /tmp/remediation-pytest.txt

      - name: Prove installed package closes PEMS resolution with source checkout absent
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/p10-pems-release /tmp/p10-pems-project /tmp/network-blocker
          mkdir -p /tmp/p10-pems-release /tmp/p10-pems-project /tmp/network-blocker
          python packaging/build_release_package.py \
            --version "$PACKAGE_VERSION" \
            --source-commit "$REMEDIATION" \
            --output-dir /tmp/p10-pems-release \
            | tee /tmp/remediation-build.json
          python - <<'PY' | tee /tmp/remediation-install.json
          import importlib.util, json
          from pathlib import Path
          spec = importlib.util.spec_from_file_location('rd_install_evidence', Path('packaging/rd_install.py'))
          module = importlib.util.module_from_spec(spec)
          assert spec.loader is not None
          spec.loader.exec_module(module)
          build = json.loads(Path('/tmp/remediation-build.json').read_text())
          result = module.install(
              Path(build['archive']), Path(build['manifest']), build['transport_sha256'], Path('/tmp/p10-pems-project')
          )
          assert result['status'] == 'PASS', result
          print(json.dumps(result, sort_keys=True))
          PY
          cp packaging/audit_runtime_isolation.py /tmp/audit_runtime_isolation.py
          cat > /tmp/network-blocker/sitecustomize.py <<'PY'
          import socket
          def _blocked(*args, **kwargs):
              raise RuntimeError('network disabled by P10 packaged PEMS evidence')
          socket.create_connection = _blocked
          socket.getaddrinfo = _blocked
          _socket = socket.socket
          class BlockedSocket(_socket):
              def connect(self, *args, **kwargs):
                  return _blocked(*args, **kwargs)
              def connect_ex(self, *args, **kwargs):
                  return _blocked(*args, **kwargs)
          socket.socket = BlockedSocket
          PY

          workspace="$GITHUB_WORKSPACE"
          parent="$(dirname "$workspace")"
          name="$(basename "$workspace")"
          tar -czf /tmp/remediation-source-backup.tgz -C "$parent" "$name"
          cd /tmp
          rm -rf "$workspace"
          restore_workspace() {
            if [ ! -d "$workspace" ]; then
              tar -xzf /tmp/remediation-source-backup.tgz -C "$parent"
            fi
          }
          trap restore_workspace EXIT

          PYTHONPATH=/tmp/network-blocker python /tmp/audit_runtime_isolation.py \
            /tmp/p10-pems-project/.reasoning-distiller \
            | tee /tmp/remediation-isolation-audit.json
          grep -q '"status": "PASS"' /tmp/remediation-isolation-audit.json

          PYTHONPATH=/tmp/network-blocker python - <<'PY' | tee /tmp/remediation-offline-schema-validation.txt
          import hashlib, json
          from pathlib import Path
          from jsonschema import Draft202012Validator
          from referencing import Registry, Resource

          root = Path('/tmp/p10-pems-project/.reasoning-distiller')
          schema_bytes = (root / 'schemas/context-pack.schema.json').read_bytes()
          pems_bytes = (root / 'backends/pems-cove/pems-v2.schema.json').read_bytes()
          registry_record = json.loads((root / 'schemas/resources/context-packaging-v1-resource-registry.json').read_text())
          schema = json.loads(schema_bytes)
          pems = json.loads(pems_bytes)
          ref = schema['$defs']['knowledgeItem']['properties']['pems']['$ref']

          def git_blob(data):
              return hashlib.sha1(b'blob ' + str(len(data)).encode('ascii') + b'\0' + data).hexdigest()
          assert git_blob(schema_bytes) == '4b240a5698294ce1a217ad758b4031830740fc29'
          assert git_blob(pems_bytes) == 'cd7683d704e8aef2842a0c1b25b453fb1dbc8030'
          assert registry_record['resources'][0]['network_resolution'] is False

          def forbid_retrieval(uri):
              raise AssertionError(f'external retrieval attempted: {uri}')
          resources = Registry(retrieve=forbid_retrieval).with_resource(ref, Resource.from_contents(pems))
          wrapper = {'$schema': 'https://json-schema.org/draft/2020-12/schema', '$ref': ref}
          validator = Draft202012Validator(wrapper, registry=resources)
          good = {'semantic': 'pems/2', 'project_id': 'p', 'records': [], 'relations': []}
          bad = dict(good)
          bad['semantic'] = 'pems/1'
          assert not list(validator.iter_errors(good))
          assert list(validator.iter_errors(bad))
          print('P10_PACKAGED_PEMS_OFFLINE_VALIDATION_PASS')
          PY
          grep -q P10_PACKAGED_PEMS_OFFLINE_VALIDATION_PASS /tmp/remediation-offline-schema-validation.txt
          echo P10_PACKAGED_PEMS_RUNTIME_ISOLATION_PASS | tee /tmp/remediation-runtime-isolation.txt

      - uses: actions/upload-artifact@v4
        with:
          name: p10-packaged-pems-remediation-824c812e
          if-no-files-found: error
          path: |
            /tmp/remediation-binding.json
            /tmp/remediation-pytest.txt
            /tmp/remediation-build.json
            /tmp/remediation-install.json
            /tmp/remediation-isolation-audit.json
            /tmp/remediation-offline-schema-validation.txt
            /tmp/remediation-runtime-isolation.txt

      - name: Enforce final remediation evidence gate
        shell: bash
        run: |
          set -euo pipefail
          grep -q P10_PACKAGED_PEMS_REMEDIATION_REGRESSION_PASS /tmp/remediation-pytest.txt
          grep -q P10_PACKAGED_PEMS_RUNTIME_ISOLATION_PASS /tmp/remediation-runtime-isolation.txt
          grep -q P10_PACKAGED_PEMS_OFFLINE_VALIDATION_PASS /tmp/remediation-offline-schema-validation.txt
          echo P10_PACKAGED_PEMS_RUNTIME_ISOLATION_ENGINEER_EXECUTION_PASS
