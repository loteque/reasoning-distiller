name: P9R4 c21535e0 adversarial execution

on:
  pull_request:
    branches:
      - implement/context-packaging-p9-remediation

permissions:
  contents: read

jobs:
  p9r4-execution:
    runs-on: ubuntu-latest
    steps:
      - name: Check out execution transport head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Preserve external P9R4 harness and bind transport
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "dbf4aed52a9806894950eb4c2b4f0cf50f6f0470"
          test "$(git rev-parse HEAD~4)" = "c21535e0d2820b0a1ba1866da60059a450470658"
          cp tests/test_context_packaging_renderer_p9r4_external_execution.py /tmp/test_context_packaging_renderer_p9r4_external_execution.py
          cp tests/test_context_packaging_renderer_p9r4_corrected_cases.py /tmp/test_context_packaging_renderer_p9r4_corrected_cases.py
          {
            echo "transport_head=$(git rev-parse HEAD)"
            echo "transport_parent=$(git rev-parse HEAD^)"
            echo "candidate_ancestor=$(git rev-parse HEAD~4)"
            echo "harness_blob=$(git rev-parse HEAD:tests/test_context_packaging_renderer_p9r4_external_execution.py)"
            echo "correction_blob=$(git rev-parse HEAD:tests/test_context_packaging_renderer_p9r4_corrected_cases.py)"
          } | tee /tmp/p9r4-transport-identities.txt

      - name: Check out exact immutable P9R3 candidate
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach c21535e0d2820b0a1ba1866da60059a450470658
          test "$(git rev-parse HEAD)" = "c21535e0d2820b0a1ba1866da60059a450470658"
          test "$(git rev-parse HEAD^)" = "ebb436a14dee2a67d778e3252892f7be5cd0e2ca"
          test "$(git rev-parse HEAD^{tree})" = "a228115c0c31026b3f406e6d07d4923827d4bb70"
          test "$(git rev-parse HEAD:context_packaging/renderer.py)" = "5512ec147e74d7a2e18f9ba10fc31cf62a1dacac"
          test "$(git rev-parse HEAD:tests/test_context_packaging_deterministic_renderer_p9.py)" = "335c139a6e6ddf08434fdc16e7a6e249ef093bdf"
          test "$(git rev-parse HEAD:tests/test_context_packaging_renderer_identity_pressure_freeze_p9r0.py)" = "a89e9fc15216e1b70c80c40b37febbdd2e352cd5"
          test "$(git rev-parse HEAD:tests/test_context_packaging_renderer_identity_protocol_freeze_p9r1.py)" = "83a593ee44b3e421dce4d5853d1d1e8271e53285"
          test "$(git rev-parse HEAD:tests/test_context_packaging_renderer_closed_bundle_p9r2.py)" = "c6676797d85951b4b0407c23840ed74d42911d39"
          test "$(git rev-parse HEAD:tests/test_context_packaging_renderer_execution_binding_p9r3.py)" = "c88ab7d901e8520711c11f5a77c3464c673b4e12"
          {
            echo "candidate=$(git rev-parse HEAD)"
            echo "parent=$(git rev-parse HEAD^)"
            echo "tree=$(git rev-parse HEAD^{tree})"
            echo "renderer_blob=$(git rev-parse HEAD:context_packaging/renderer.py)"
          } | tee /tmp/p9r4-candidate-identities.txt

      - name: Set up exact CPython 3.12.0
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.0"

      - name: Verify exact runtime ABI
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' | tee /tmp/p9r4-runtime.txt
          import platform
          import sys
          print(f"implementation={sys.implementation.name}")
          print(f"version={sys.version}")
          print(f"version_info={sys.version_info[:3]}")
          print(f"cache_tag={sys.implementation.cache_tag}")
          assert platform.python_implementation() == "CPython"
          assert sys.implementation.name == "cpython"
          assert sys.version_info[:3] == (3, 12, 0)
          assert sys.implementation.cache_tag == "cpython-312"
          PY

      - name: Install bounded test dependencies
        run: python -m pip install --disable-pip-version-check pytest jsonschema==4.25.1 referencing PyYAML==6.0.2

      - name: Compile candidate and external harnesses
        run: |
          python -m py_compile \
            context_packaging/renderer.py \
            /tmp/test_context_packaging_renderer_p9r4_external_execution.py \
            /tmp/test_context_packaging_renderer_p9r4_corrected_cases.py

      - name: Run P9R0-P9R3 frozen/local gates
        shell: bash
        run: |
          set +e
          python -m pytest -q \
            tests/test_context_packaging_renderer_identity_pressure_freeze_p9r0.py \
            tests/test_context_packaging_renderer_identity_protocol_freeze_p9r1.py \
            tests/test_context_packaging_renderer_closed_bundle_p9r2.py \
            tests/test_context_packaging_renderer_execution_binding_p9r3.py \
            2>&1 | tee /tmp/p9r4-frozen-local-gates.txt
          status=${PIPESTATUS[0]}
          set -e
          echo "P9R4_FROZEN_STATUS=$status" >> "$GITHUB_ENV"

      - name: Run authoritative RI-01 through RI-24 matrix
        shell: bash
        run: |
          set +e
          PYTHONPATH="$PWD:/tmp" python -m pytest -q -vv \
            /tmp/test_context_packaging_renderer_p9r4_external_execution.py \
            -k 'not RI_02 and not RI_17' \
            2>&1 | tee /tmp/p9r4-ri-matrix.txt
          base_status=${PIPESTATUS[0]}
          PYTHONPATH="$PWD:/tmp" python -m pytest -q -vv \
            /tmp/test_context_packaging_renderer_p9r4_corrected_cases.py \
            2>&1 | tee -a /tmp/p9r4-ri-matrix.txt
          corrected_status=${PIPESTATUS[0]}
          status=0
          if [ "$base_status" -ne 0 ] || [ "$corrected_status" -ne 0 ]; then
            status=1
          fi
          set -e
          echo "P9R4_RI_BASE_STATUS=$base_status" >> "$GITHUB_ENV"
          echo "P9R4_RI_CORRECTED_STATUS=$corrected_status" >> "$GITHUB_ENV"
          echo "P9R4_RI_STATUS=$status" >> "$GITHUB_ENV"

      - name: Run original P9 renderer regressions
        shell: bash
        run: |
          set +e
          python -m pytest -q tests/test_context_packaging_deterministic_renderer_p9.py \
            2>&1 | tee /tmp/p9r4-original-p9-pytest.txt
          pytest_status=${PIPESTATUS[0]}
          python -m unittest -v tests.test_context_packaging_deterministic_renderer_p9 \
            2>&1 | tee /tmp/p9r4-original-p9-unittest.txt
          unittest_status=${PIPESTATUS[0]}
          set -e
          echo "P9R4_ORIGINAL_PYTEST_STATUS=$pytest_status" >> "$GITHUB_ENV"
          echo "P9R4_ORIGINAL_UNITTEST_STATUS=$unittest_status" >> "$GITHUB_ENV"

      - name: Run unaffected P0-P8 context-packaging regressions
        shell: bash
        run: |
          set +e
          mapfile -t tests < <(
            find tests -maxdepth 1 -type f -name 'test_context_packaging_*.py' -print \
              | sort \
              | grep -v -E 'deterministic_renderer_p9|renderer_.*_p9r[0-9]'
          )
          python -m pytest -q "${tests[@]}" \
            -k 'not test_p5_runtime_implementation_is_unchanged_by_amendment and not test_negative_fixtures_reject_and_classify_exactly' \
            2>&1 | tee /tmp/p9r4-p0-p8-regressions.txt
          status=${PIPESTATUS[0]}
          set -e
          echo "P9R4_P0_P8_STATUS=$status" >> "$GITHUB_ENV"

      - name: Reproduce inherited P1b PS-19 classifier mismatch separately
        shell: bash
        run: |
          set +e
          python -m pytest -q tests/test_context_packaging_protocol_schemas_p1b.py::P1b::test_negative_fixtures_reject_and_classify_exactly \
            2>&1 | tee /tmp/p9r4-inherited-ps19.txt
          status=${PIPESTATUS[0]}
          set -e
          test "$status" -eq 1
          grep -F 'PS-19' /tmp/p9r4-inherited-ps19.txt
          grep -F 'PLANE_CLASSIFICATION_CONFLICT' /tmp/p9r4-inherited-ps19.txt
          grep -F 'UNKNOWN_SEMANTICS_FIELD' /tmp/p9r4-inherited-ps19.txt
          echo 'P1B_PS19_CLASSIFIER_MISMATCH_REPRODUCED' | tee -a /tmp/p9r4-inherited-ps19.txt

      - name: Enforce P9R4 execution gate
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' \
            "frozen_status=${P9R4_FROZEN_STATUS}" \
            "ri_base_status=${P9R4_RI_BASE_STATUS}" \
            "ri_corrected_status=${P9R4_RI_CORRECTED_STATUS}" \
            "ri_status=${P9R4_RI_STATUS}" \
            "original_pytest_status=${P9R4_ORIGINAL_PYTEST_STATUS}" \
            "original_unittest_status=${P9R4_ORIGINAL_UNITTEST_STATUS}" \
            "p0_p8_status=${P9R4_P0_P8_STATUS}" \
            | tee /tmp/p9r4-summary.txt
          test "$P9R4_FROZEN_STATUS" -eq 0
          test "$P9R4_RI_STATUS" -eq 0
          test "$P9R4_ORIGINAL_PYTEST_STATUS" -eq 0
          test "$P9R4_ORIGINAL_UNITTEST_STATUS" -eq 0
          test "$P9R4_P0_P8_STATUS" -eq 0
          echo P9R4_EXECUTION_PASS | tee -a /tmp/p9r4-summary.txt
