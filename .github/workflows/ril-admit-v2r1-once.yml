name: Execute activated first V2R1 admission

on:
  pull_request:
    paths:
      - '.github/workflows/ril-admit-v2r1-once.yml'

permissions:
  contents: write

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  admit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validation dependency
        run: python -m pip install --disable-pip-version-check 'jsonschema>=4.23,<5'
      - name: Execute exact activated Steward admission and R14 verification
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import importlib.util
          import json
          import sys
          from pathlib import Path
          from jsonschema import Draft202012Validator

          ROOT = Path('.').resolve()
          BASE_SHA = 'dba6b8553594c6e5a0e21e993ee46e09cb40018c'
          SUBMISSION_ID = 'RGP-5F3E7F7DDB028217FB7D9DA79E650DE4'
          INVOCATION_ID = 'admit-first-normative-v2r1-post-project-identity-20260820'
          ACTIVATION_SOURCE = 'Activate steward:default for admission of RGP-5F3E7F7DDB028217FB7D9DA79E650DE4 in invocation admit-first-normative-v2r1-post-project-identity-20260820'
          EXPECTED_FIRST_BASE = '27904e567c70720a416b87e4572c28047c33da6751daf7b5e69a660ef90d3a53'
          CANDIDATE_PATH = ROOT / 'project-knowledge/submissions/first-normative-baseline-v2r1-20260820.json'
          REQUEST_PATH = ROOT / 'project-knowledge/invocations/first-normative-baseline-v2r1-20260820.request.json'
          DISPOSITION_PATH = Path('project-knowledge/reconciliation/dispositions/c800162bcb96007caf0ebe4c8f51e1689cf572bafa9eb604ec27d134757178e2.json')

          sys.path.insert(0, str(ROOT / '.reasoning-distiller/runtime'))
          from ril_activation import make_explicit_activation, validate_activation
          from ril_admission import PLAN_CONTRACT, admit, apply_plan, first_admission_base, jcs, sha256_bytes
          from ril_storage_verification import verify_storage
          from ril_mutation import digest

          assert not (ROOT / 'project-knowledge/canonical/pems2.jcs.json').exists()
          assert not (ROOT / 'project-knowledge/canonical/cove1.jcs.json').exists()

          submission = json.loads(CANDIDATE_PATH.read_text(encoding='utf-8'))
          request = json.loads(REQUEST_PATH.read_text(encoding='utf-8'))
          assert submission['submission_id'] == SUBMISSION_ID
          assert submission['rgp_version'] == 'rgp/1'
          assert submission['validation']['status'] == 'passed'
          assert request['invocation_id'] == 'first-normative-baseline-v2r1-20260820'
          assert submission['candidate_graph'].get('relations', []) == []

          registry = request['source_registry']
          assert registry == request['evidence']
          assert len(registry) == 8
          by_source = {}
          for source in registry:
              source_id = source['source_id']
              locator = source['locator']
              source_type = source['type']
              assert source_type in {'repository_file', 'governed_artifact'}
              prefix = 'file' if source_type == 'repository_file' else 'governed'
              expected_source_id = f"src:{prefix}:" + hashlib.sha256(locator.encode('utf-8')).hexdigest()[:24]
              assert source_id == expected_source_id
              actual_digest = 'sha256:' + hashlib.sha256((ROOT / locator).read_bytes()).hexdigest()
              assert actual_digest == source['digest'], (locator, source['digest'], actual_digest)
              assert source_id not in by_source
              by_source[source_id] = source

          activation = make_explicit_activation('steward:default', INVOCATION_ID, ACTIVATION_SOURCE)
          activation_result = validate_activation(ROOT, 'admission', activation)
          print(json.dumps({'activation': activation, 'validation': activation_result}, sort_keys=True))
          assert activation_result['status'] == 'PASS', activation_result
          assert activation_result['outcome'] == 'ACTIVATION_ACCEPTED', activation_result
          assert activation_result['invocation_id'] == INVOCATION_ID

          def h(text: str) -> str:
              return hashlib.sha256(text.encode('utf-8')).hexdigest()[:24]

          source_record_ids = {}
          observation_record_ids = {}
          new_records = []
          for source_id in sorted(by_source):
              source = by_source[source_id]
              sid = 'pems:source:' + h(source_id)
              oid = 'pems:source_observation:' + h(source_id + '\0' + source['digest'])
              source_record_ids[source_id] = sid
              observation_record_ids[source_id] = oid
              authority = 'repository_state' if source['type'] == 'repository_file' else 'other'
              new_records.append({
                  'id': sid,
                  'kind': 'source',
                  'lifecycle': 'current',
                  'data': {
                      'source_kind': source['type'],
                      'authority': authority,
                      'identity_locator': {
                          'repository': 'loteque/reasoning-distiller',
                          'path': source['locator'],
                      },
                  },
              })
              new_records.append({
                  'id': oid,
                  'kind': 'source_observation',
                  'lifecycle': 'historical',
                  'data': {
                      'source_id': sid,
                      'evidence_state': 'immutable_snapshot',
                      'observed_at': request['created_at'],
                      'evidence_locator': {
                          'repository': 'loteque/reasoning-distiller',
                          'commit': BASE_SHA,
                          'path': source['locator'],
                      },
                      'captured_fingerprint': source['digest'],
                  },
              })

          candidate_records = submission['candidate_graph']['records']
          assert len(candidate_records) == 29
          seen_temp = set()
          for record in candidate_records:
              temp_id = record['temp_id']
              assert temp_id not in seen_temp
              seen_temp.add(temp_id)
              assert record['kind'] in {'observation', 'assumption', 'claim'}
              provenance = {}
              for role, refs in record.get('provenance', {}).items():
                  assert role in {'primary', 'corroborating', 'context', 'untyped'}
                  assert len(refs) == len(set(refs))
                  mapped = []
                  for ref in refs:
                      assert ref in observation_record_ids, (temp_id, ref)
                      mapped.append(observation_record_ids[ref])
                  provenance[role] = sorted(mapped)
              assert provenance
              proposition = {
                  'id': 'pems:proposition:' + h(SUBMISSION_ID + '\0' + temp_id),
                  'kind': 'proposition',
                  'lifecycle': 'current',
                  'data': {
                      'statement': record['statement'],
                      'proposition_kind': record['kind'],
                      'epistemic_role': 'asserted',
                  },
                  'provenance': provenance,
              }
              new_records.append(proposition)

          base = first_admission_base(ROOT)
          base_sha = sha256_bytes(jcs(base))
          assert base_sha == EXPECTED_FIRST_BASE, base_sha
          plan = {
              'contract': PLAN_CONTRACT,
              'expected_base_sha256': base_sha,
              'reuse_record_ids': [],
              'record_updates': [],
              'new_records': sorted(new_records, key=lambda r: r['id']),
              'new_relations': [],
          }
          assert len(plan['new_records']) == 45

          preflight = apply_plan(base, plan)
          schema = json.loads((ROOT / 'backends/pems-cove/pems-v2.schema.json').read_text(encoding='utf-8'))
          schema_validator = Draft202012Validator(schema)
          module_path = ROOT / 'backends/pems-cove/validate_pems2_contract.py'
          spec = importlib.util.spec_from_file_location('_admission_preflight_validator', module_path)
          assert spec and spec.loader
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          integrity = module.validate_candidate_document(preflight, schema_validator)
          assert integrity['record_count'] == 46, integrity
          assert integrity['relation_count'] == 0, integrity
          assert integrity['provenance_references_resolved'] is True
          print(json.dumps({'plan_digest': digest(plan), 'preflight_integrity': integrity}, sort_keys=True))

          result = admit(ROOT, DISPOSITION_PATH, activation, plan)
          print(json.dumps({'r13': result}, sort_keys=True))
          assert (result['status'], result['outcome']) == ('PASS', 'ADMITTED'), result

          verification = verify_storage(ROOT)
          print(json.dumps({'r14': verification}, sort_keys=True))
          assert (verification['status'], verification['outcome']) == ('PASS', 'VERIFIED'), verification
          assert verification['pems_sha256'] == result['admitted_pems_sha256']
          assert verification['cove_sha256'] == result['admitted_cove_sha256']
          PY
      - name: Restrict durable mutation and remove runner
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git status --porcelain=v1 --untracked-files=all | awk '{print $2}')"
          test -n "$changed"
          while IFS= read -r path; do
            test -z "$path" && continue
            case "$path" in
              project-knowledge/admission/*|project-knowledge/canonical/*) ;;
              *) echo "Unexpected mutation before runner cleanup: $path" >&2; exit 1 ;;
            esac
          done <<< "$changed"
          git rm -- .github/workflows/ril-admit-v2r1-once.yml
      - name: Commit exact admitted state
        shell: bash
        run: |
          set -euo pipefail
          git add -- project-knowledge/admission project-knowledge/canonical
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'project-knowledge: admit reviewed V2R1 candidate'
          git push origin HEAD:ril/admit-first-normative-v2r1-post-identity
