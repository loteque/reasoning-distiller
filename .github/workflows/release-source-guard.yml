name: Release Source Guard

on:
  push:
    branches: [release-source]
  pull_request:
    branches: [release-source]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refuse installed Reasoning Distiller state
        shell: bash
        run: |
          set -euo pipefail
          if [ -e .reasoning-distiller ]; then
            echo '.reasoning-distiller/ is forbidden on release-source' >&2
            exit 1
          fi
          if git ls-files | grep -q '^\.reasoning-distiller/'; then
            echo 'installed Reasoning Distiller files are tracked on release-source' >&2
            exit 1
          fi
          echo 'PASS release-source contains no installed Reasoning Distiller tree'
