name: P1d Conformance Evidence

on:
  push:
    branches:
      - evidence/p1d-945ff72c-conformance
    paths:
      - .github/workflows/p1d-conformance-evidence.yml
  pull_request:
    branches:
      - evidence/p1d-945ff72c-base
    paths:
      - .github/workflows/p1d-conformance-evidence.yml

permissions:
  contents: read

jobs:
  p1d-conformance:
    runs-on: ubuntu-latest
    env:
      TARGET_SHA: 945ff72ccee87310642ff78c4b4c8e01c46fb551
      LIVE_MAIN_BASIS: 58b99891e116b5a06dd603810c2b98ea83e328c3
      GOVERNING_PLAN: 0803bcca5343224d6feefa53c2f1b8baf1d4a8cd
      SUITE: tests/test_context_packaging_pems_closure_p1d.py
    steps:
      - name: Checkout immutable P1d candidate
        uses: actions/checkout@v4
        with:
          ref: 945ff72ccee87310642ff78c4b4c8e01c46fb551
          fetch-depth: 1

      - name: Verify immutable candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          printf 'target_sha=%s\n' "$TARGET_SHA"
          printf 'suite_blob=%s\n' "$(git hash-object "$SUITE")"
          printf 'descriptor_blob=%s\n' "$(git hash-object protocols/rgp/pems2-context-closure-v1.json)"
          printf 'fixture_blob=%s\n' "$(git hash-object tests/fixtures/context-packaging-pems-closure-p1d.json)"
          printf 'pems_schema_blob=%s\n' "$(git hash-object backends/pems-cove/pems-v2.schema.json)"
          printf 'pems_validator_blob=%s\n' "$(git hash-object backends/pems-cove/validate_pems2_contract.py)"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install conformance dependency
        run: python -m pip install --disable-pip-version-check jsonschema==4.25.1

      - name: Record environment
        shell: bash
        run: |
          set -euo pipefail
          {
            printf 'target_sha=%s\n' "$TARGET_SHA"
            printf 'live_main_basis=%s\n' "$LIVE_MAIN_BASIS"
            printf 'governing_plan=%s\n' "$GOVERNING_PLAN"
            printf 'suite=%s\n' "$SUITE"
            printf 'suite_blob=%s\n' "$(git hash-object "$SUITE")"
            printf 'descriptor_blob=%s\n' "$(git hash-object protocols/rgp/pems2-context-closure-v1.json)"
            printf 'fixture_blob=%s\n' "$(git hash-object tests/fixtures/context-packaging-pems-closure-p1d.json)"
            printf 'pems_schema_blob=%s\n' "$(git hash-object backends/pems-cove/pems-v2.schema.json)"
            printf 'pems_validator_blob=%s\n' "$(git hash-object backends/pems-cove/validate_pems2_contract.py)"
            python --version
            python -m pip show jsonschema referencing
          } > p1d-environment.txt
          cat p1d-environment.txt

      - name: Execute P1d conformance suite
        id: suite
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest -v "$SUITE" 2>&1 | tee p1d-conformance.log

      - name: Write result metadata
        if: always()
        shell: bash
        env:
          SUITE_OUTCOME: ${{ steps.suite.outcome }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          evidence = {
              "contract": "reasoning-distiller-p1d-conformance-execution-evidence/1",
              "candidate_commit": os.environ["TARGET_SHA"],
              "live_main_basis": os.environ["LIVE_MAIN_BASIS"],
              "governing_plan_commit": os.environ["GOVERNING_PLAN"],
              "suite": os.environ["SUITE"],
              "command": "python -m unittest -v tests/test_context_packaging_pems_closure_p1d.py",
              "outcome": os.environ.get("SUITE_OUTCOME", "unknown"),
              "p1e_started": False,
              "steward_reconciliation_performed": False,
          }
          Path("p1d-execution-evidence.json").write_text(
              json.dumps(evidence, sort_keys=True, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          print(Path("p1d-execution-evidence.json").read_text(encoding="utf-8"), end="")
          PY

      - name: Upload execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p1d-conformance-945ff72c
          path: |
            p1d-conformance.log
            p1d-environment.txt
            p1d-execution-evidence.json
          if-no-files-found: error
