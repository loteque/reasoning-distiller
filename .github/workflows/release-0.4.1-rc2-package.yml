name: Reasoning Distiller 0.4.1 RC2 Package

on:
  push:
    branches: [release-0.4.1-rc2-package]
    paths:
      - '.github/workflows/release-0.4.1-rc2-package.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  RELEASE_VERSION: '0.4.1'
  SOURCE_SHA: 'c66bbcd4371a5163af1f822906b471f58eb45452'
  ARTIFACT_NAME: 'reasoning-distiller-0.4.1-rc2-package'

jobs:
  build-release-candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release-0.4.1-rc2-package
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/checkout@v4
        with:
          repository: loteque/reasoning-distiller
          ref: ${{ env.SOURCE_SHA }}
          path: release-source
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install package dependency
        run: python -m pip install --disable-pip-version-check jsonschema==4.25.1

      - name: Enforce clean release source
        shell: bash
        run: |
          set -euo pipefail
          test ! -e release-source/.reasoning-distiller
          ! git -C release-source ls-files | grep -q '^\.reasoning-distiller/'

      - name: Run package and invocation suites before build
        working-directory: release-source
        run: |
          python -m unittest -v tests/test_package_builder.py
          python -m unittest -v tests/test_production_invocation.py
          python -m unittest -v tests/test_distill_ingest.py

      - name: Build once after Python tests
        working-directory: release-source
        shell: bash
        run: |
          set -euo pipefail
          python packaging/build_release_package.py \
            --version "$RELEASE_VERSION" \
            --source-commit "$SOURCE_SHA" \
            --output-dir /tmp/rd-0.4.1-a

      - name: Seed generated cache artifacts and rebuild
        working-directory: release-source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime/__pycache__ validators/__pycache__
          printf 'deliberate-cache-noise' > runtime/__pycache__/rd_distill.cpython-312.pyc
          printf 'deliberate-cache-noise' > validators/__pycache__/rgp_validator.cpython-312.pyc
          printf 'deliberate-cache-noise' > agents/generated.pyc
          python packaging/build_release_package.py \
            --version "$RELEASE_VERSION" \
            --source-commit "$SOURCE_SHA" \
            --output-dir /tmp/rd-0.4.1-b
          cmp /tmp/rd-0.4.1-a/reasoning-distiller-0.4.1.tar.gz /tmp/rd-0.4.1-b/reasoning-distiller-0.4.1.tar.gz
          cmp /tmp/rd-0.4.1-a/reasoning-distiller-0.4.1.manifest.json /tmp/rd-0.4.1-b/reasoning-distiller-0.4.1.manifest.json
          cmp /tmp/rd-0.4.1-a/reasoning-distiller-0.4.1.sha256 /tmp/rd-0.4.1-b/reasoning-distiller-0.4.1.sha256

      - name: Validate release candidate
        working-directory: release-source
        run: python packaging/validate_install_package_contract.py --manifest /tmp/rd-0.4.1-a/reasoning-distiller-0.4.1.manifest.json

      - name: Upload exact release candidate
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: |
            /tmp/rd-0.4.1-a/reasoning-distiller-0.4.1.tar.gz
            /tmp/rd-0.4.1-a/reasoning-distiller-0.4.1.manifest.json
            /tmp/rd-0.4.1-a/reasoning-distiller-0.4.1.sha256
          if-no-files-found: error
          retention-days: 7

      - name: Persist RC2 PASS evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-candidate
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          manifest = json.loads(Path('/tmp/rd-0.4.1-a/reasoning-distiller-0.4.1.manifest.json').read_text(encoding='utf-8'))
          status = {
              'contract': 'reasoning-distiller-release-candidate-status/1',
              'status': 'PASS',
              'release_version': os.environ['RELEASE_VERSION'],
              'source_commit': os.environ['SOURCE_SHA'],
              'content_identity': manifest['content_identity'],
              'transport_sha256': manifest['transport_sha256'],
              'file_count': len(manifest['files']),
              'artifact_name': os.environ['ARTIFACT_NAME'],
              'cache_adversary': 'PASS',
              'workflow_run': os.environ['GITHUB_RUN_ID'],
          }
          Path('release-candidate/0.4.1-rc2-status.json').write_text(json.dumps(status, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print(json.dumps(status, sort_keys=True))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- release-candidate/0.4.1-rc2-status.json
          git commit -m 'build: record 0.4.1 RC2 package'
          git push origin HEAD:release-0.4.1-rc2-package
