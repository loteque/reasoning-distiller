name: P10 G3 48e272e3 Engineer evidence

on:
  pull_request:
    branches:
      - impl/p10-g3-provenance-bridge-20260825

permissions:
  contents: read

jobs:
  g3-provenance-bridge:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact G3 semantic candidate
        uses: actions/checkout@v4
        with:
          ref: 48e272e35f902a9f6e0ee4111e6220cbcef1d7cd
          fetch-depth: 0
      - name: Set up exact P9 runtime
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.0"
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check pytest jsonschema==4.25.1 referencing PyYAML==6.0.2
      - name: Verify immutable candidate, G2 base, bounded delta, and exact ABI
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "48e272e35f902a9f6e0ee4111e6220cbcef1d7cd"
          test "$(git merge-base HEAD 95eac1148744d90b9074cbdfce82edfe4751f87a)" = "95eac1148744d90b9074cbdfce82edfe4751f87a"
          expected_delta=$'.gitattributes\ncontext_packaging/__init__.py\ncontext_packaging/provenance_bridge.py\ndocs/implementation/context-packaging/P10_G3_PROVENANCE_BRIDGE.md\ntests/test_context_packaging_production_integration_p10_g3.py'
          test "$(git diff --name-only 95eac1148744d90b9074cbdfce82edfe4751f87a..HEAD)" = "$expected_delta"
          python - <<'PY'
          import sys
          assert sys.implementation.name == 'cpython'
          assert sys.version_info[:3] == (3, 12, 0), sys.version
          assert sys.implementation.cache_tag == 'cpython-312', sys.implementation.cache_tag
          print('P10_G3_EXACT_RUNTIME_PASS')
          PY
      - name: Run exact G3 provenance gate
        run: python -m pytest -q tests/test_context_packaging_production_integration_p10_g3.py

  g3-package-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 48e272e35f902a9f6e0ee4111e6220cbcef1d7cd
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.0"
      - run: python -m pip install --disable-pip-version-check pytest jsonschema==4.25.1 referencing PyYAML==6.0.2
      - name: Verify exact candidate
        run: test "$(git rev-parse HEAD)" = "48e272e35f902a9f6e0ee4111e6220cbcef1d7cd"
      - name: Run G2 package closure and immutable persistence regressions
        run: python -m pytest -q tests/test_context_packaging_production_integration_p10_g2.py tests/test_context_packaging_persistence_adapter_p6.py tests/test_package_builder.py tests/test_install_package_contract.py tests/test_installer_p3.py tests/test_installer_p4.py

  g3-predecessor-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 48e272e35f902a9f6e0ee4111e6220cbcef1d7cd
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.0"
      - run: python -m pip install --disable-pip-version-check pytest jsonschema==4.25.1 referencing PyYAML==6.0.2
      - name: Run G0 G1 G2 P9 and fixed production regressions
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "48e272e35f902a9f6e0ee4111e6220cbcef1d7cd"
          python -m pytest -q \
            tests/test_context_packaging_production_integration_p10_g0.py \
            tests/test_context_packaging_production_integration_p10_g1.py \
            tests/test_context_packaging_production_integration_p10_g2.py \
            tests/test_context_packaging_renderer_identity_protocol_freeze_p9r1.py \
            tests/test_context_packaging_renderer_closed_bundle_p9r2.py \
            tests/test_context_packaging_renderer_execution_binding_p9r3.py \
            tests/test_context_packaging_deterministic_renderer_p9.py \
            tests/test_context_packaging_renderer_ri15_remediation.py \
            tests/test_production_invocation.py
