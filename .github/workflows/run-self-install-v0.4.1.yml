name: Self-install Reasoning Distiller v0.4.1

on:
  push:
    branches: [install-v0.4.1]
    paths:
      - '.github/workflows/run-self-install-v0.4.1.yml'

permissions:
  contents: write

env:
  RELEASE_VERSION: '0.4.1'
  RELEASE_TAG: 'v0.4.1'
  RELEASE_SOURCE_SHA: 'c66bbcd4371a5163af1f822906b471f58eb45452'
  EXPECTED_CONTENT_IDENTITY: 'sha256:bd51dfe217dcc250f352a053e18a37d43fba8294ef578a45187ce1f8041a8af7'
  EXPECTED_TRANSPORT_SHA256: '5068efcecea970ab0ef8c9bf46688faa30ff3e7aef51a668ee6e7de8a75e4ee5'

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: install-v0.4.1
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install package-contract dependency
        run: |
          echo dependency > /tmp/rd-install-stage
          python -m pip install --disable-pip-version-check jsonschema==4.25.1

      - name: Retrieve exact release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          echo retrieve > /tmp/rd-install-stage
          set -euo pipefail
          rm -rf /tmp/rd-release && mkdir -p /tmp/rd-release
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir /tmp/rd-release
          test "$(find /tmp/rd-release -maxdepth 1 -type f | wc -l)" -eq 7
          for name in \
            install-package-manifest.schema.json \
            installation-record.schema.json \
            rd_install.py \
            "reasoning-distiller-${RELEASE_VERSION}.manifest.json" \
            "reasoning-distiller-${RELEASE_VERSION}.sha256" \
            "reasoning-distiller-${RELEASE_VERSION}.tar.gz" \
            validate_install_package_contract.py; do
            test -f "/tmp/rd-release/$name"
          done
          rm -rf /tmp/schemas && mkdir -p /tmp/schemas
          cp /tmp/rd-release/install-package-manifest.schema.json /tmp/schemas/install-package-manifest.schema.json
          cp /tmp/rd-release/installation-record.schema.json /tmp/schemas/installation-record.schema.json

      - name: Verify release identity
        shell: bash
        run: |
          echo release-identity > /tmp/rd-install-stage
          set -euo pipefail
          manifest="/tmp/rd-release/reasoning-distiller-${RELEASE_VERSION}.manifest.json"
          detached="/tmp/rd-release/reasoning-distiller-${RELEASE_VERSION}.sha256"
          archive="/tmp/rd-release/reasoning-distiller-${RELEASE_VERSION}.tar.gz"
          test "$(awk '{print $1}' "$detached")" = "$EXPECTED_TRANSPORT_SHA256"
          test "$(sha256sum "$archive" | awk '{print $1}')" = "$EXPECTED_TRANSPORT_SHA256"
          python /tmp/rd-release/validate_install_package_contract.py --manifest "$manifest"
          python3 - "$manifest" <<'PY'
          import json, os, sys
          m=json.load(open(sys.argv[1], encoding='utf-8'))
          assert m['version'] == os.environ['RELEASE_VERSION']
          assert m['source_commit'] == os.environ['RELEASE_SOURCE_SHA']
          assert m['content_identity'] == os.environ['EXPECTED_CONTENT_IDENTITY']
          assert m['transport_sha256'] == os.environ['EXPECTED_TRANSPORT_SHA256']
          assert len(m['files']) == 47
          print('PASS release identity')
          PY

      - name: Install v0.4.1 over verified prior installation
        shell: bash
        run: |
          echo install > /tmp/rd-install-stage
          set -euo pipefail
          python /tmp/rd-release/rd_install.py \
            --package "/tmp/rd-release/reasoning-distiller-${RELEASE_VERSION}.tar.gz" \
            --manifest "/tmp/rd-release/reasoning-distiller-${RELEASE_VERSION}.manifest.json" \
            --transport-sha256 "$EXPECTED_TRANSPORT_SHA256" \
            --target "$GITHUB_WORKSPACE" \
            --source-repository loteque/reasoning-distiller \
            --source-locator "$RELEASE_TAG"

      - name: Validate installed identity and ingestion wizard
        shell: bash
        run: |
          echo installed-validation > /tmp/rd-install-stage
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          d=json.loads(Path('.reasoning-distiller/.installation/INSTALLATION.json').read_text(encoding='utf-8'))
          assert d['version'] == os.environ['RELEASE_VERSION']
          assert d['source_commit'] == os.environ['RELEASE_SOURCE_SHA']
          assert d['source_locator'] == os.environ['RELEASE_TAG']
          assert d['content_identity'] == os.environ['EXPECTED_CONTENT_IDENTITY']
          assert d['transport_sha256'] == os.environ['EXPECTED_TRANSPORT_SHA256']
          print('PASS installed identity')
          PY
          test "$(python .reasoning-distiller/runtime/rd_distill.py --version)" = 'reasoning-distiller-invocation/1'
          python .reasoning-distiller/runtime/rd_distill.py ingest --help | grep -q -- '--evidence'
          python .reasoning-distiller/runtime/rd_distill.py ingest \
            --evidence docs/design/RIL_CLI_DESIGN_CONTRACT.md \
            --invocation-id install-smoke-v041 \
            --created-at 2026-08-20T10:20:00-07:00 \
            --context 'v0.4.1 installed ingestion smoke' \
            --dry-run
          test ! -e project-knowledge/invocations/install-smoke-v041.request.json
          test ! -e project-knowledge/invocations/install-smoke-v041.bundle.json

      - name: Commit verified installed tree
        shell: bash
        run: |
          echo commit > /tmp/rd-install-stage
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          status={
            'contract':'reasoning-distiller-self-install-status/1',
            'status':'PASS',
            'release_version':os.environ['RELEASE_VERSION'],
            'release_tag':os.environ['RELEASE_TAG'],
            'source_commit':os.environ['RELEASE_SOURCE_SHA'],
            'content_identity':os.environ['EXPECTED_CONTENT_IDENTITY'],
            'transport_sha256':os.environ['EXPECTED_TRANSPORT_SHA256'],
            'ingest_smoke':'PASS',
            'workflow_run':os.environ['GITHUB_RUN_ID'],
          }
          Path('.github/install-v0.4.1-status.json').write_text(json.dumps(status,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          PY
          git add -- .reasoning-distiller .github/install-v0.4.1-status.json
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          ! git diff --cached --name-only | grep -v -E '^(\.reasoning-distiller/|\.github/install-v0\.4\.1-status\.json$)'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'install: Reasoning Distiller v0.4.1'
          git push origin HEAD:install-v0.4.1

      - name: Persist failure stage
        if: failure()
        shell: bash
        run: |
          set +e
          stage="$(cat /tmp/rd-install-stage 2>/dev/null || echo setup)"
          STAGE="$stage" python3 - <<'PY'
          import json, os
          from pathlib import Path
          status={
            'contract':'reasoning-distiller-self-install-status/1',
            'status':'FAIL',
            'stage':os.environ['STAGE'],
            'release_version':os.environ['RELEASE_VERSION'],
            'release_tag':os.environ['RELEASE_TAG'],
            'source_commit':os.environ['RELEASE_SOURCE_SHA'],
            'content_identity':os.environ['EXPECTED_CONTENT_IDENTITY'],
            'transport_sha256':os.environ['EXPECTED_TRANSPORT_SHA256'],
            'workflow_run':os.environ['GITHUB_RUN_ID'],
          }
          Path('.github/install-v0.4.1-status.json').write_text(json.dumps(status,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- .github/install-v0.4.1-status.json
          git commit -m "install: record v0.4.1 failure at ${stage}" || true
          git push origin HEAD:install-v0.4.1 || true
